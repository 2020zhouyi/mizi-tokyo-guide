向JR上野；普通车选宇都宫/高崎线大宫方向，并在屏幕确认停赤羽。Green车厢另收费。"],"query":"京成上野駅 JR上野駅","sources":["sky","keiseimap","uenomap","green","skyfaq"],"map":null,"poi":null,"kind":"交通"},{"id":"hotel-checkin","time":"16:00–17:00 目标","title":"入住赤羽 · LiVEMAX","summary":"女生一间，男生一间真正的Twin双床房。","body":["HOTEL LiVEMAX 赤羽駅前，東京都北区赤羽1-3-10，JR赤羽南改札・东口约1分钟。","15:00入住、10:00退房；官网注明不提供行李寄存。两间房连住12/5、6、7三晚，空房、床型与费用以实际订单为准。","先放行李、补水、充电，再轻装出门；药妆清单按型号和容量分好。"],"query":"ホテルリブマックス赤羽駅前 東京都北区赤羽1-3-10","sources":["livemax"],"map":"akabane","poi":"hotel","kind":"住宿"},{"id":"akabane-group","time":"17:10–17:20","title":"赤羽站前 · 第一张合影","summary":"入住后拍一张站名与街灯，随后走站外通道去西口。","body":["站在人行空间边缘，以JR赤羽站名或东口街灯交代地点；先拍合影再收相机，避开下班与购物人流。","合影优先35–50mm、F4–5.6；三人站同一平面，请路人帮拍或在允许处用手机定时，不把支架放在通道。"],"query":"赤羽駅 東口","sources":["jrmap"],"map":"akabane","poi":"station-photo","kind":"游览","groupShot":true},{"id":"akabane-uniqlo","time":"17:30–18:15","title":"UNIQLO 赤羽Bivio","summary":"从东口到西口，先补基础衣服。","body":["Bivio 2F，现行10:00–21:00；过站外东西通道，不需要为穿过车站刷卡。","先试尺寸，再看颜色和数量。若落地延误，不为这一站压缩吃饭和休息。"],"query":"ユニクロ 赤羽ビビオ店","sources":["uniqlo"],"map":"akabane","poi":"uniqlo","kind":"购物"},{"id":"akabane-ramen","time":"18:30–19:30","title":"麺処 夏海 · 第一碗拉面","summary":"清汤酱油拉面，落地后的第一顿热饭。","body":["赤羽1-18-4，晚间18:00–22:00，售罄可提前结束。每人预算¥1,200–1,800。","11席吧台，三人可能分开坐。备现金，按店方顺序排队和买食券；预计等位超过30分钟就近换店。"],"query":"麺処 夏海 赤羽1-18-4","sources":["natsumi"],"map":"akabane","poi":"natsumi","kind":"美食"},{"id":"akabane-drug","time":"19:45–21:00","title":"Matsukiyo LAB · 药妆采购","summary":"先核对药妆型号与容量；之后按体力决定是否去居酒屋。","body":["赤羽1-9-3，药妆零售现行09:00–22:45；处方调剂窗口时间另算。","比较同型号、同容量的含税价。旅行中会使用的消耗品，与准备退税带回的商品分开正常结账。","2026/11/1起适用免税退款制，店内先付含税价；详细带出确认流程见“交通教程→返程机场”。"],"query":"Matsukiyo LAB 赤羽東口駅前店 赤羽1-9-3","sources":["matsu","tax","taxfaq"],"map":"akabane","poi":"drug","kind":"购物"},{"id":"akabane-izakaya","time":"21:10–22:20","title":"赤羽一番街 · 烤串第二轮","summary":"可选｜还有胃口和体力时去；次日早起，吃饱可直接回酒店。","body":["药妆店到一番街步行约5–10分钟，先在街口补一张合影，再进店；街道是示意，实际看导航。","主选やきとん大王 赤羽店，赤羽1-23-6；官网现行每日12:00–23:30，每人参考¥2,000–3,000。点烤猪肉串与一两道小菜，三人先问能否同桌。","备选立ち飲みいこい本店，赤羽1-3-8；周六11:00–22:00，只适合21:10左右入内、短停后离开，是站立式，不能保证三人相邻。","备现金；吸烟安排进门前确认，不接受就换店。已吃拉面，不必再点完整套餐或连续跑两家。"],"query":"やきとん大王 赤羽店 東京都北区赤羽1-23-6","sources":["yakiton-akabane","yakiton-details","ikoi-official"],"map":"akabane","poi":"yakiton","kind":"美食","optional":true,"verify":true,"groupShot":true}]},"d6":{"id":"d6","date":"12.06","weekday":"周日","label":"浅草 · 涩谷","title":"清晨浅草，涩谷购物与天空日落","intro":"06:40出发，上午浅草；109留近3小时，15:40目标入场SKY。","maps":["asakusa","shibuya"],"pace":"清晨＋购物＋日落","note":"SKY按未购票的目标时段编排。抢不到15:40场，优先恢复109至16:30＋路口夜拍；夜场只在买到票、体力允许时替换。","stops":[{"id":"d6-breakfast","time":"06:20–06:35","title":"便利店早餐 · 在酒店吃完","summary":"前晚买好饭团、面包与饮品；06:40出发。","body":["优先12/5晚买好，按包装保存条件冷藏或常温，早上在酒店快速吃完；不边走边吃。","临时补买可用赤羽南改札内NewDays（现行06:30开门），但不为等店和选购拖延列车；每人参考¥500–800。"],"query":"ニューデイズ エキュート赤羽みなみ","sources":["newdays-akabane"],"map":"akabane","poi":"newdays","kind":"美食","verify":true},{"id":"to-asakusa","time":"06:40–07:25 目标","title":"赤羽 → 上野 → 浅草","summary":"JR南行到上野，出闸后换银座线G浅草方向。","body":["1. 赤羽刷自己的IC卡，JR南行到上野；普通车即可。","2. 出JR检票口，跟随G银座线标识，重新进东京Metro闸机。","3. 坐浅草G19方向，下车后导航雷门；门到门约45–55分钟，具体班次出发前复核。"],"query":"浅草 雷門","sources":["jrmap","metro-ueno","metro-asakusa"],"map":"asakusa","poi":"g","kind":"交通","verify":true},{"id":"senso","time":"07:25–08:15","title":"雷门 → 仲见世 → 宝藏门、本堂","summary":"清晨先拍街道纵深与建筑，店铺开门后再回来买点心。","body":["冬季本堂现行06:30开堂、17:00闭堂，清晨通常比中午从容，不保证无人。","24–35mm沿中轴拍雷门与仲见世，50–70mm取灯笼和屋檐；雷门外合影，给参拜者留通道。","08:15从寺院区出发，步行约10分钟去吾妻桥；别把拍摄时间延到文化中心开门后。"],"query":"浅草 雷門 浅草寺 本堂","sources":["senso"],"map":"asakusa","poi":"senso","kind":"游览","groupShot":true},{"id":"azuma","time":"08:25–08:50","title":"吾妻桥与隅田川","summary":"桥、河面、晴空塔，清晨用轮廓和反光构图。","body":["浅草一侧向东拍晴空塔，清晨容易逆光；保留桥和楼群的剪影，不强求顺光蓝天。","24–35mm把桥斜放入画，50–70mm减少天空取塔和楼群；风强时缩短河岸停留。","08:50收相机，步行返回雷门对面文化观光中心。"],"query":"吾妻橋 浅草 隅田川","sources":["center"],"map":"asakusa","poi":"azuma","kind":"游览"},{"id":"asakusa-center","time":"09:00–09:25","title":"文化观光中心 8F","summary":"09:00开放后上楼，从高处看浅草中轴。","body":["8F展望露台官网现行09:00–22:00；其他楼层开放时段各异，临时维护按现场公告。","50–70mm竖幅取仲见世轴线，24–35mm横幅交代街区；玻璃/栏杆前移半步避开反光。"],"query":"浅草文化観光センター 東京都台東区雷門2-18-9","sources":["center"],"map":"asakusa","poi":"center","kind":"游览"},{"id":"nakamise","time":"09:30–10:15","title":"仲见世回逛 · 团子与舟和","summary":"点心挑1–2种，10:15离开去坐地铁。","body":["あづま放在09:40左右；商店街标09:00营业，部分资料写09:30，按现场开门与售罄安排，不保证每家同时开。","可选舟和仲見世2号店，官网现行09:30–19:00，买少量芋ようかん或あんこ玉。保质与冷藏要求看包装，准备当天吃。","不在通道边走边吃，按店家指定位置停下；店内近拍先问。"],"query":"浅草 仲見世 舟和 仲見世2号店","sources":["aduma-official","funawa"],"map":"asakusa","poi":"kaminarimon","kind":"游览"},{"id":"to-shibuya","time":"10:15–11:15","title":"银座线浅草 → 涩谷","summary":"银座线直达，留足进站、候车和出站步行。","body":["1. 浅草G19刷IC进站，往涩谷G01方向。","2. 列车约35分钟；加步行和候车，门到门留约45–60分钟。","3. 涩谷银座线是高架站，先出闸下到地面，再导航魚べい道玄坂店，不照抄其他地铁地下出口。"],"query":"魚べい 渋谷道玄坂店 東京都渋谷区道玄坂2-29-11","sources":["ginza","uobei-official"],"map":"shibuya","poi":"uobei","kind":"交通","verify":true},{"id":"shibuya-lunch","time":"11:15–12:10","title":"魚べい · 寿司午餐","summary":"周日10:30开门；11:15目标到店，吃完走去109。","body":["官网现行日祝10:30–23:00，地址道玄坂2-29-11。每人参考¥1,500–2,500，先点握寿司与热汤，再按食量追加。","到店看叫号和排队，三人可能不是连坐；预计等位超过25分钟就换原备选マンモス，别连续排两家。","マンモス周日11:30开门，浓厚つけ麺＋胚芽麺；若午餐推迟，优先缩短午餐与休息，14:00会合照旧。"],"query":"魚べい 渋谷道玄坂店 東京都渋谷区道玄坂2-29-11","sources":["uobei-official","mammoth"],"map":"shibuya","poi":"uobei","kind":"美食","verify":true},{"id":"shibuya109","time":"12:20–15:10","title":"SHIBUYA109 本馆","summary":"约2小时50分；分组购物者仍可10:00先逛，14:00正门会合。","body":["本馆道玄坂2-29-1，现行10:00–21:00；不要走去MAGNET。先记楼层、试尺码，再集中结账。","14:00固定在109本馆正门会合；先到的购物组可继续逛，不必一起走浅草。","15:10收尾离店，购物袋准备在SKY规定的储物柜寄存，别卡着15:40才到楼下。"],"query":"SHIBUYA109 道玄坂2-29-1","sources":["109"],"map":"shibuya","poi":"109","kind":"购物"},{"id":"to-shibuya-sky","time":"15:10–15:40","title":"步行到Scramble Square · 上14F","summary":"步行及找电梯约15–20分钟，再留检票缓冲。","body":["从109过路口到涩谷站东侧Scramble Square，导航SHIBUYA SKY入口；不要把Hikarie当成同一栋。","上14F入口核对票面时段；上楼、排队和46F寄存还需时间，15:40是目标入场券，不是已经站上屋顶。"],"query":"SHIBUYA SKY 渋谷スクランブルスクエア 14F","sources":["shibuya-sky-access"],"map":"shibuya","po S指示出站，商场与站直接连接。"],"query":"MARK IS みなとみらい","sources":["jrmap","mm","markisaccess"],"map":"yokohama","poi":"markis","kind":"交通"},{"id":"yoko-lunch","time":"11:30–13:15","title":"MARK IS · 寿司午餐","summary":"めぐみ水産有桌席，三人先申请一起坐。","body":["MARK IS 4F，寿司预算¥1,800–3,500/人；分批点，先看盘价，不吃生鱼可找熟食。","周一商店/食阁现行10:00–20:00，餐厅11:00–23:00；各店末单不同。","午饭后可在商场短逛，再走到海边。不要为这一顿再绕去中华街。"],"query":"めぐみ水産 MARK ISみなとみらい店","sources":["sushi","markis"],"map":"yokohama","poi":"markis","kind":"美食"},{"id":"yoko-walk","time":"13:15–15:00","title":"汽車道 → 象鼻公园 → 大栈桥","summary":"边走边停拍；咖啡点心优先放在去程。","body":["经汽車道、新港桥梁等可通行步道前往象鼻公园和大栈桥。地图是顺序示意，具体路口按导航走。","汽車道后可顺路到World Porters 1F Leonard’s外带现炸糖面包（原味¥250）；排队超过15分钟就跳过，15:00到大栈桥。","想吃苹果派或热狗，去大栈桥之前到象鼻咖啡：食品末单17:00、饮品17:30。","若走累，港未来线到日本大通り站可缩短海港步行。"],"query":"象の鼻テラス","sources":["os","bridge","cafe","leonards"],"map":"yokohama","poi":"cafe","kind":"游览"},{"id":"yoko-osanbashi","time":"15:00–16:55","title":"大栈桥屋顶 · 甲板与天际线","summary":"16:28理论日落，留到16:55等城市灯光与天色平衡。","body":["24–28mm让木甲板线条由画面角落引向楼群；35–50mm拍城市层次，70mm取摩天轮和建筑局部。","12/7横滨国立天文台日落16:28，约16:28–16:58作为余晖拍摄窗口；16:20、16:35、16:50可在同一机位各拍一组。先拍三人合影，再等楼群亮灯，16:55离开。","本线以手持随拍为主，布置器材或正式拍摄先核对场地规定。风大时先暖手、提高快门。","三人站同一排，35–70mm交代海港、F4–5.6、1/250秒起；木甲板通道留给行人。想等17:15更深夜色，就相应缩短市集，不延长整晚返程。"],"query":"横浜港大さん橋国際客船ターミナル","sources":["os","yokosun"],"map":"yokohama","poi":"osanbashi","kind":"游览","groupShot":true},{"id":"yoko-market","time":"17:25–19:00","title":"红砖仓库 · 圣诞市集","summary":"16:55离屋顶，回岸上步行约30分钟到红砖。","body":["2026活动期11/20–12/25；12/7现行11:00–22:00，16:00亮灯，普通票¥500/人，吃喝另付。","11/6日本12:00＝上海11:00起官网购票。三人买3张普通票，线上票也可能排队。","先看建筑和灯饰，再挑一份热食与热饮。市集餐饮预算按¥1,500–3,000/人，已包含在四天餐费预算中。","先在不挡入口的位置拍三人和红砖灯光合影；市集热食当小吃，20:00左右在横滨站补正餐。"],"query":"横浜赤レンガ倉庫","sources":["market","akarenga"],"map":"yokohama","poi":"redbrick","kind":"游览","groupShot":true},{"id":"yoko-air-cabin","time":"19:00–19:40","title":"可选 · AIR CABIN 夜景缆车","summary":"运行正常、排队约20分钟以内再坐；单程¥1,000/人。","body":["红砖市集结束后，步行约10–15分钟到運河パーク站，买单程票坐到桜木町站；车程约5分钟。19:40为连步行、候车的规划到达时间，排队长就直接走去樱木町或改马车道。","成人现行单程¥1,000；横滨市观光协会列通常平日10:00–21:00，但12/7专属运行日历与最后受理时间尚未确认，出发前查官网，风雨或检修可能停运。","相机靠近车窗但不碰撞玻璃，深色衣服能减轻室内反光；35–50mm、F2.8、1/125秒起，拍摩天轮和楼群，不依赖长曝光。抵樱木町后到JR站。"],"query":"YOKOHAMA AIR CABIN 運河パーク駅","sources":["v4_air_cabin","v4_air_cabin_city"],"map":"yokohama","poi":"air-cabin","kind":"游览","optional":true,"verify":true},{"id":"yoko-to-station","time":"19:00–20:00（按选项衔接）","title":"海港 → 横滨站 · 晚餐前转场","summary":"不坐缆车走马车道；坐缆车从樱木町搭JR到横滨。","body":["不坐AIR CABIN：红砖到马车道留约15分钟，港未来线北行到横滨，出闸去相铁JOINUS。通常可19:30前后到餐厅，候位较长就提前登记。","坐AIR CABIN：约19:40抵樱木町后，走到JR，乘京滨东北/根岸线北行到横滨，车程约3–4分钟；加步行与候车，目标20:00前后到JOINUS。","市集已经吃饱、想早回时，可从樱木町直接坐京滨东北/根岸线北行去赤羽，约75分钟；看大宫、南浦和或赤羽方向，不要上横滨线八王子/桥本方向。"],"query":"横浜駅 相鉄ジョイナス","sources":["mm","v4_sakuragicho_jr","v4_yoko_direct_example","v4_yoko_jr","jrmap"],"map":"yokohama","poi":"yokohama-station","kind":"交通","verify":true},{"id":"yoko-dinner","time":"20:00–21:00","title":"勝烈庵 · 横滨站猪排晚餐","summary":"市集后补一顿正餐，吃完从横滨站回赤羽。","body":["官网11:00–23:00，L.O.22:00（可能按情况调整）。","ロースかつ定食（三元豚）官网当前¥2,750；お好み定食¥3,080，含炸虾与一口猪排。","坐席餐厅；三人同桌按现场安排。","市集没吃饱再去。官方页面未明确线上订位，本攻略按现场排队；等位过长则选同层其他正餐，不再横穿市区。"],"query":"勝烈庵 相鉄ジョイナス店 神奈川県横浜市西区南幸1-5-1 相鉄ジョイナス","sources":["katsuretsuan"],"map":null,"poi":null,"kind":"美食","verify":true},{"id":"yoko-return","time":"21:00–22:15左右","title":"横滨 → 赤羽 · 晚饭后回酒店","summary":"优先JR湘南新宿线北行，确认经过新宿并停赤羽。","body":["餐后留步行时间回JR横滨站，按当天导航找湘南新宿线北行。到赤羽车程约50分钟，另加候车；本段给出21:00–22:15的门到门规划，不绑定某一班。","若在樱木町直接回：京滨东北/根岸线北行到赤羽约75分钟，不用换车。若想更快，在横滨付费区内换湘南新宿线，但候车过久时未必更省时。","现行工作日参考：樱木町19:40→赤羽20:52直达；横滨21:09→赤羽21:59经新宿。这两班仅说明路线和车程，12/7用餐后按实时可乘班次走，不为赶21:09提前跑站。"],"query":"横浜駅 JR 湘南新宿ライン","sources":["v4_yoko_jr","v4_sakuragicho_jr","v4_yoko_direct_example","v4_yoko_fast_example","jrmap"],"map":"yokohama","poi":"yokohama-station","kind":"交通","verify":true}]},"outingTransport":{"title":"横滨一日 · 海港慢走，JR收尾","intro":"去程横滨换港未来线；市集后可选AIR CABIN到樱木町，或步行去马车道。横滨站晚餐后乘JR回赤羽。","steps":[["10:00 赤羽 → JR横滨","湘南新宿线逗子/小田原方向，或上野东京线南行；先看停站表确认有横滨。"],["横滨 → 港未来 → MARK IS","出JR闸机换港未来线，元町・中华街方向；港未来站与商场相连。"],["13:15 MARK IS → 象鼻公园 → 大栈桥","沿可通行步道和桥梁，咖啡点心放去程；15:00到大栈桥，16:55前留给日落余晖。"],["16:55 大栈桥 → 红砖市集","原路回陆岸，再经新港桥梁，步行预留约30分钟，17:25左右到红砖。"],["19:00 市集 → 横滨站","常规：马车道乘港未来线。可选：步行运河公园坐AIR CABIN到樱木町，再搭JR一站到横滨。"],["20:00左右 横滨站晚餐","正餐与候位留约1小时；若不坐缆车可更早吃，若市集已吃饱可直接回酒店。"],["21:00后 横滨 → 赤羽","湘南新宿线北行约50分钟，另加候车和进出站，预计22:00前后回赤羽。"]],"notes":[["樱木町直达赤羽","京滨东北/根岸线北行约75分钟；认大宫、南浦和、赤羽方向。横滨线八王子/桥本方向不去赤羽。"],["横滨换乘更快的条件","樱木町→横滨约3–4分钟，在JR付费区内换湘南新宿北行；从横滨到赤羽约50分钟，实际是否更快取决于等车。"],["AIR CABIN可选费用","成人单程¥1,000。通常平日10:00–21:00为现行参考，12/7运行与最后受理尚待确认；排队长或停运就按地面路线走。"],["费用口径","往返和市内交通预留¥2,000＋市集¥500＝¥2,500/人。缆车选择后另加¥1,000，餐食在四天餐费中计算。"],["雨天与风大","MARK IS可延长室内停留；大栈桥强风缩短，缆车以当天运行公告为准。"],["班次为参考","19:40樱木町直达赤羽20:52；21:09横滨经新宿到赤羽21:59，来自现行工作日表。用餐后选择实际赶得上的班次，12月再查。"]],"sources":["jrmap","mm","markisaccess","os","bridge","akarenga","market","yokosun","v4_air_cabin","v4_air_cabin_city","v4_sakuragicho_jr","v4_yoko_jr","v4_yoko_direct_example","v4_yoko_fast_example"]},"optionalCosts":[{"id":"air-cabin","label":"AIR CABIN 运河公园→樱木町单程","amount":1000,"verify":true,"sources":["v4_air_cabin","v4_air_cabin_city"]}]},"kamakura":{"id":"kamakura","name":"镰仓","english":"KAMAKURA & INAMURAGASAKI","number":"03","tag":"寺院与海边日落","subtitle":"八幡宫、小町通、两座古寺，稻村崎等冬日晚光。","fit":"想逛古寺、地方街道和海岸；晴天有机会远望富士山。","early":"08:10左右离店","weather":"晴天看稻村崎；厚云改由比滨短走","walk":"约6–8公里，有寺院台阶；海边视风雨缩短","booking":"普通JR与江之电不用订指定席；赤羽收尾晚餐建议订位","budget":[36820,42820],"commonTransit":2000,"outing":3920,"outingBreakdown":"JR往返预留¥2,600＋江之电三段¥620＋长谷寺¥400＋高德院¥300；高校前延伸的一日券差额另选","photo":"kamakura","map":"kamakura","sunny":"15:45–16:55留在稻村崎，先合影，再看西侧海湾、江之岛与富士山剪影；山不保证露脸。","cloudy":"厚云看不到山时，改长谷附近的由比滨短走；江之电只坐两段¥400，少于晴天主线¥220。","rainy":"短时小雨以寺院与街道为主，强风或持续雨取消海岸。出发前可改横滨室内线；八幡宫文华馆周一通常休息，不列作确定雨备。","day":{"id":"d7","date":"12.07","weekday":"周一","label":"镰仓与稻村崎","title":"镰仓 · 古寺之后，去稻村崎等晚光","intro":"08:33赤羽出发为现行参考；上午八幡宫与小町通，下午两寺，15:45–16:55留给稻村崎。","maps":["kamakura"],"pace":"约6–8公里＋部分台阶","note":"日落点位计算16:29，现场山体可能提前挡日。参考18:05镰仓直达19:24赤羽；JR班次在12月出发前复核。","stops":[{"id":"kama-breakfast","time":"07:20–07:50","title":"赤羽 · 喫茶店早餐","summary":"早餐吃完回酒店整理，08:10出发。","body":["周一07:15–22:00；早餐套餐供应至10:30，店内当日供应为准。","モーニング・セットA（火腿蛋沙拉三明治）＋S咖啡，官网参考¥500起；升级饮品另补差。","108席禁烟座位，另有吸烟室；3人自行找相邻空位。","不需预约。07:50离店，08:10前进站准备；队长就改外带，不挤压列车。"],"query":"12/7 镰仓 · Doutor早餐 東京都北区赤羽1-1-1 ビーンズ赤羽","sources":["doutor-akabane","doutor-morning"],"map":null,"poi":null,"kind":"美食","verify":true},{"id":"kama-outbound","time":"08:10–09:53","title":"赤羽 → 镰仓 · 找“逗子”行","summary":"08:25前进站，参考08:33发、09:53到，普通车直达。","body":["前往JR赤羽站，各自刷自己的IC卡；认湘南新宿ライン南行“逗子 / Zushi”。现行2531Y普通车08:33→09:53，途中不用在新宿换车；Green车另收费，早高峰不保证三人相邻座位。","小田原、平塚、国府津行走东海道线支线，不直达镰仓；如乘这类车，在大船付费区内转横须贺线逗子/横须贺/久里滨方向。大船后先北镰仓、再镰仓，别提前下车。","本方案JR往返预留¥2,600/人，属于预算；精确车费与班次出发前再查。"],"query":"鎌倉駅","sources":["k_jr_outbound","k_jr_akabane_index","k_jr_network","green"],"map":"kamakura","poi":"station","kind":"交通","verify":true},{"id":"kama-hachimangu","time":"09:53–10:55","title":"若宫大路 / 段葛 → 鹤冈八幡宫","summary":"东口出闸，先走参道向北，10:10左右到神社。","body":["JR镰仓东口到神社官方步行约10分钟，行程留约17分钟找路和取景。去程走若宫大路/段葛，回程走小町通，形成一圈。","10:10–10:55看舞殿、池畔与社殿外观；体力允许再登主殿前石段。一般境内免费，楼门现行06:00–20:00；宝物殿与特别展不纳入本线。","个人欣赏以外（包括业务、公开用途）的拍摄须按神社公告核对许可，范围含段葛；现场禁拍标识优先。文华馆及其咖啡周一通常休息。"],"query":"鶴岡八幡宮","sources":["k_hachimangu_visit","k_hachimangu_free","k_hachimangu_photo"],"map":"kamakura","poi":"hachimangu","kind":"游览"},{"id":"kama-komachi","time":"10:55–11:30","title":"小町通 · 顺路买鸽子饼","summary":"逛回车站，丰岛屋本店与小町通小店择一短停。","body":["小町通与若宫大路大致平行，各店营业时间独立；上午先参拜，稍晚再逛店。不要把所有店都写成同一开门时间。","拍门面、暖帘与食物细节即可，店内先问是否可拍，避开街道中心停留。去过的朋友可少逛一段，直接在CIAL 2F餐厅门外会合。","想买鳩サブレー，可从小町通短绕若宫大路丰岛屋本店（小町2-11-19）：现行09:00–19:00，周三不定休；周一按通常营业，临时调整看官网。11:30前回东口CIAL午餐。"],"query":"鎌倉 小町通り","sources":["k_komachi","v4_toyoshimaya"],"map":"kamakura","poi":"komachi","kind":"游览"},{"id":"kama-lunch","time":"11:30–12:15","title":"CIAL 2F · 风凛午餐","summary":"站前坐下吃热饭，目标12:15离店。","body":["主选“鎌倉こまち市場 風凛”，JR镰仓东口改札外CIAL 2F。周一现行11:00–22:00、末单21:00；三人先询问同桌，不保证即到即坐。","可选熟小鱼盖饭，或虾与星鳗天妇罗盖饭；不把生小鱼当必有供应。规划¥1,800–2,800/人，菜单现价详见美食页。","若排队会拖过12:15，就改站前及时出餐的简餐，保留下午寺院与海边时间。午餐后已经在站外，按“西口/江ノ電”指示走地下道。"],"query":"鎌倉こまち市場 風凛 CIAL鎌倉 2F","sources":["k_furin","k_enoden_gate_2026"],"map":"kamakura","poi":"station","kind":"美食"},{"id":"kama-enoden-out","time":"12:15–12:40","title":"江之电镰仓 EN15 → 长谷 EN12","summary":"西口乘藤泽方向；车程约4分钟，连候车留25分钟。","body":["从东侧站外经地下道到江之电西口闸机，用自己的Suica/PASMO刷入；依次经过和田塚EN14、由比滨EN13，到长谷EN12下车刷出。整段留25分钟，包含站外步行和候车。","主线三段：镰仓→长谷¥200、长谷→稻村崎¥200、稻村崎→镰仓¥220，共¥620/人；一日券¥800，主线刷IC少花¥180/人。若加高校前并坐四段，按次合计¥860，改用¥800一日券更合适。","如需长谷站下车坡道，镰仓上车前告知站员。2026/7起JR连络闸机仅接受同一张交通IC，纸票、QR或信用卡乘车须用江之电西口。"],"query":"長谷駅 江ノ電","sources":["k_enoden_hase_access","k_enoden_hase","k_enoden_pass","k_enoden_gate_2026","v4_enoden_fare"],"map":"kamakura","poi":"hase","kind":"交通"},{"id":"kama-buddha","time":"12:40–13:35","title":"高德院 · 先看镰仓大佛","summary":"步行留15分钟，12:55–13:35看大佛外观。","body":["长谷站向内陆步行到高德院，官方约7–10分钟，本方案留15分钟。先到较北的大佛，再向南走长谷寺与海边，少走回头路。","成人¥300；冬季08:00–17:00，16:45停止入场。胎内体验另¥50，最后16:20入场，胎内禁止摄影，不为此排长队。","35–50mm拍大佛与环境，50–70mm补侧脸和铜像细节。入寺前吃完街边食物和纸杯饮料；需要减少台阶可参考寺方坡道路线，局部仍有高低差。","三人合影放在开放且不挡通行的位置：35–50mm交代大佛，人物站成同一排，F4–5.6、1/250秒起；不把三脚架架在参道中央。"],"query":"高徳院 鎌倉大仏","sources":["k_kotoku_visit","k_kotoku_faq","k_kotoku_access"],"map":"kamakura","poi":"buddha","kind":"游览","groupShot":true},{"id":"kama-hasedera","time":"13:35–15:00","title":"长谷寺 · 庭院、堂宇与海光露台","summary":"步行约10分钟，13:45入寺，留75分钟慢慢看。","body":["下境内庭院→台阶上行→观音堂参拜→海光露台看海→返回入口。额外眺望散步路和弁天窟按体力选做，湿滑或疲劳就跳过。","成人¥400；12月普通08:00–16:30受理、17:00关山。2026夜枫公告只到12/6，12/7不默认延长开放，也不承诺红叶正盛。","主拍庭院水面、堂宇外观和露台海湾；观音堂内遵守禁拍规定。上下境内有台阶，需要完整无台阶路线须事先问寺方。观音博物馆秋展到12/6，12/7开放尚须确认。"],"query":"鎌倉 長谷寺","sources":["k_hasedera_visit","k_hasedera_grounds","k_hasedera_night2026","k_kannon_museum"],"map":"kamakura","poi":"hasedera","kind":"游览"},{"id":"kama-kokomae","time":"14:25–15:45（替代热饮）","title":"可选 · 高校前海岸道口","summary":"仅长谷寺14:25前结束、放弃热饮时考虑；15:45回到稻村崎。","body":["本段替换长谷寺最后约35分钟与热饮，不在原时间表后叠加。长谷→镰仓高校前EN08，车程约14分钟；只在合法步行空间短看海岸道口，之后返稻村崎EN10约6分钟。具体班次与候车再查。","四段票价：镰仓→长谷¥200、长谷→高校前¥220、高校前→稻村崎¥220、稻村崎→镰仓¥220，共¥860。决定走此线时，在第一次乘江之电前改买一日券¥800，比主线预算多¥180/人。","15:20仍未到返程站台就放弃继续拍摄，优先回稻村崎；到达长谷站已接近15:00则直接去稻村崎，不去高校前。道路与人行道狭窄，遵守现场引导，不站车道或轨道。"],"query":"鎌倉高校前駅","sources":["v4_enoden_fare","k_enoden_pass","k_enoden_ic","v4_kama_manners"],"map":"kamakura","poi":"kokomae","kind":"游览","optional":true,"verify":true},{"id":"kama-break","time":"15:00–15:20","title":"长谷站旁 · 热饮与短休息","summary":"含步行与买饮料；15:20在长谷站外会合。","body":["Tully’s江之电长谷站店现行周一09:00–18:00。长谷寺步行回站与买热饮共留20分钟，店内有空位才短坐；没有空位或寺院晚出来，就直接去车站。","15:20在长谷站外不挡入口处会合，乘藤泽方向去稻村崎；这20分钟不再安排第二家店。","力餅家外带可替代热饮，不与坐下休息叠加；尽量在15:20前完成。"],"query":"タリーズコーヒー 江ノ電長谷駅店","sources":["k_tullys","chikara"],"map":"kamakura","poi":"hase","kind":"美食","optional":true},{"id":"kama-yuigahama-backup","time":"15:20–16:30（阴天替换）","title":"阴天备选 · 由比滨短走","summary":"厚云看不到山、但海风不强时，替换稻村崎往返。","body":["从长谷站步行到由比滨，留约10–15分钟找路与过街；浪纹、湿沙和近岸层次更容易拍。强风或持续雨则取消海岸。","约16:30离海，向北步行到由比滨EN13，乘镰仓方向回站。此线江之电仅镰仓→长谷¥200、由比滨→镰仓¥200，共¥400，比晴天主线少¥220/人。","回JR后可按实时导航选择更早的经新宿列车；不把此备选与稻村崎、高校前叠加。"],"query":"由比ヶ浜海岸","sources":["k_beach_access","k_enoden_yuigahama","v4_enoden_fare"],"map":"kamakura","poi":"yuigahama","kind":"游览","optional":true},{"id":"kama-inamura-transfer","time":"15:20–15:45","title":"长谷 EN12 → 稻村崎 EN10","summary":"藤泽方向2站，车程约4分钟；出站步行约5分钟到公园。","body":["长谷站刷自己的IC进站，坐藤泽方向，经极乐寺EN11到稻村崎EN10；单程¥200/人。25分钟包含进站、候车、车程与过街步行，不是固定班次。","稻村崎站出站后按“稲村ヶ崎公園”导航，走人行道与过街设施，官方步行约5分钟。先到公园较宽阔的看海处，不下礁石。","如果错过一班车导致晚到，直接到公园，不再追加高校前。"],"query":"稲村ヶ崎公園","sources":["v4_enoden_fare","v4_inamura_station","v4_inamura_park"],"map":"kamakura","poi":"inamuragasaki","kind":"交通"},{"id":"kama-beach","time":"15:45–16:55","title":"稻村崎 · 海湾、远山与日落余晖","summary":"15:45先合影；16:29理论日落，留到16:55看余色。","body":["到公园先拍三人合影与开阔海湾，再面向西侧找江之岛与富士山轮廓。富士山是否可见取决于云层和能见度，不是必有景观。","24–35mm保留草坡、海岸与远山三层；50–70mm收紧浪带和山体关系。人物站同一排，F4起、1/250秒起；夕光先照顾脸部亮度，逆光也可拍剪影。","国立天文台按稻村崎坐标、无遮挡地平线计算12/7日落16:29；西侧山体和云层可能提前挡日。约16:29–16:59为规划用余晖窗口，不保证日落入海或富士山方向落日。16:55离开。","只在开放的公园步道与宽阔观景处停留；强风、扬沙或雨势大就缩短，不在海边换镜头。"],"query":"稲村ヶ崎公園 鎌倉市稲村ガ崎1-19","sources":["v4_inamura_park","v4_light_kamakura","v4_light_method"],"map":"kamakura","poi":"inamuragasaki","kind":"游览","groupShot":true,"verify":true},{"id":"kama-enoden-back","time":"16:55–17:35","title":"稻村崎 EN10 → 镰仓 EN15 → JR","summary":"步行回站＋候车；江之电约10分钟，回镰仓再转JR。","body":["公园步行约5分钟回稻村崎EN10，乘镰仓方向，经过极乐寺、长谷、由比滨、和田塚到镰仓EN15；票价¥220/人。","稻村崎是无人站，按现场IC进出站设备提示刷卡，不因为无人检票漏刷；候车与换乘共留约40分钟。","全程用同一张IC可走JR连络闸机；纸票、QR一日券或信用卡乘车要先出江之电西口，再按JR入口进站。到JR后看“新宿経由”并确认停赤羽。"],"query":"稲村ヶ崎駅 江ノ電","sources":["v4_enoden_fare","v4_inamura_station","k_enoden_ic","k_enoden_gate_2026"],"map":"kamakura","poi":"inamura-station","kind":"交通"},{"id":"kama-return","time":"17:35–19:24","title":"镰仓 → 赤羽 · 18:05直达参考","summary":"18:05古河行，经新宿，19:24到赤羽；晚一班18:38。","body":["17:35左右到JR付费区后补水、洗手间和候车。现行工作日2554Y普通古河行18:05镰仓发，经新宿19:08–19:09，19:24到赤羽，途中不用换车。","赶不上时参考18:38宇都宫行2556Y，19:55到赤羽；12/7实际开行、分钟与停站以出发前JR时刻表为准，不跑着追车。","确认“新宿経由 / 赤羽停車”；东京、千叶、成田机场方向不直接到赤羽。直达班次变更时，按导航在大船付费区内换经新宿的湘南新宿线。","正常19:24到赤羽后，步行去预订的晚餐；若坐18:38备用班次，及时把餐厅预约改晚。"],"query":"鎌倉駅 JR 湘南新宿ライン","sources":["v4_kama_return_1805","v4_kama_return_1838","k_jr_kamakura_index","k_jr_network"],"map":"kamakura","poi":"station","kind":"交通","verify":true},{"id":"kama-dinner","time":"19:40–20:50","title":"香味苑 · 赤羽烧肉收尾","summary":"回赤羽步行到店，三人普通桌席提前订位；备现金。","body":["现行16:00–23:00；21:00前入店、L.O.21:45；周二、周三休，周一营业。","カルビ或中ロース官网当前每份¥1,639，配蔬菜、米饭；按3人共享盘数估算，不把一盘价格当人均套餐。","63席，全席禁烟；3人订普通桌席，包间从4人起。","建议预约20:00左右席位；官网现行只收现金。若列车延误及时联系，21:00后不默认还能入店。"],"query":"炭火焼肉 香味苑 東京都北区赤羽1-37-7 コンチネンタルプラザ赤羽弐番館1F","sources":["koumien","koumien-hours","koumien-menu"],"map":null,"poi":null,"kind":"美食","verify":true}]},"outingTransport":{"title":"镰仓一日 · 去程逗子行，晚光后经新宿回","intro":"同一张IC贯穿JR与江之电。主线三段江之电¥620；只有加高校前四段时，才改用¥800一日券。","steps":[["08:10 离店 → 赤羽JR","08:25前进站；认湘南新宿线南行“逗子 / Zushi”。现行08:33→09:53为工作日参考，12月再核对。"],["镰仓东口 → 八幡宫 → 小町通","参道去、小町通回；丰岛屋本店09:00–19:00通常周一营业，11:30前回站楼午餐。"],["12:15 江之电西口 → 长谷EN12","站外地下道到西口，藤泽方向，经和田塚、由比滨；约4分钟、¥200，含候车留25分钟。"],["15:20 长谷EN12 → 稻村崎EN10","藤泽方向，经极乐寺；约4分钟、¥200。出站走约5分钟到公园，15:45–16:55看海与晚光。"],["16:55 公园 → 稻村 考虑；15:45需回稻村崎。全程四段时用¥800一日券。","query":"鎌倉高校前駅","shape":"square"}]}},"transport":{"arrival":{"title":"从成田机场到赤羽酒店","intro":"出发前网购3张Skyliner成人往返优惠票；到成田T1兑换，京成与JR分开乘坐。","steps":[["出发前 · 网购3张往返优惠票","¥4,500/人需先在网上购买，三人合计¥13,500；保存兑换凭证。网站机场列车预算按这个优惠价计算。"],["成田T1 · 完成入境","入境 → 提取行李 → 海关；按落地13:15规划，先留约90分钟。"],["B1 · 京成 KEISEI","在成田T1凭网购凭证与护照首次兑换，领取去程车票和返程兑换券。核对去程车次、车厢和座位，收好返程兑换券，并询问能否提前指定返程；首次兑换不能留到上野或日暮里。"],["Skyliner → 京成上野","约45–55分钟。完整车票按票进闸，IC不要再重复刷付。"],["步行 → JR上野","朝正面口 / JR上野駅方向；拖箱留10–15分钟。按电梯标识找无障碍路线。"],["JR上野 → 赤羽","宇都宫/高崎线，大宫方向，确认停赤羽；普通车，不额外进Green车。"],["赤羽南改札・东口 → 酒店","步行约1分钟；先入住放箱子，再采购。"]],"notes":[["怎么买机场列车","成人往返¥4,500是仅限网购的优惠，先买3张再到成田兑换。未预购的柜台标准单程¥2,580，去回各买一次¥5,160/人；三人¥15,480，普通JR接驳另付。不要预留落地后过紧的乘车时间。"],["上野拖箱换乘","京成正面口步行向JR上野不忍口一侧，最短走法不保证无楼梯；必要时按电梯指示问中央改札。可出示：JR上野駅の中央改札まで、エレベーターで行きたいです。"],["每人一张交通卡","Suica/PASMO用于普通JR和地铁接驳；各人进出闸都用自己的卡。Green车厢需另买Green券。"]],"sources":["sky","nrt","keiseimap","uenomap","green","skyfaq"]},"city":{"title":"东京市内 · JR与地铁怎么换","intro":"06:40赤羽出发，浅草与涩谷间用银座线；15:10从109离店，给SKY上楼与寄存留足时间。","steps":[["06:40 赤羽 → 上野","JR南行，普通车；出JR闸机后换银座线。"],["上野 → 浅草G19","往浅草方向，目标约07:25到雷门；班次与实际候车出发前复核。"],["10:15左右 浅草 → 涩谷G01","银座线直达约35分钟，门到门留45–60分钟。"],["15:10 109 → SHIBUYA SKY","步行至Scramble Square并上14F入口；目标15:40票，上楼寄存需缓冲。"],["20:00左右 涩谷 → 赤羽","JR埼京线/湘南新宿线北行，确认停赤羽。"]],"notes":[["换运营方就看闸机","JR和东京Metro不是同一付费区，按各自闸机出入。纸票产品与IC不要叠加重复支付。"],["少走冤枉路","先搜索日文店名和门牌号，同行集合用具体建筑正门，别只约“涩谷站”。"],["充值与余额","每人先充¥2,000–3,000，不足再补。实体Welcome Suica有效28天，余额不退；旅行末尾控制充值额。"],["SKY并非现场随到随上","买到指定时段后再锁定安排；票务现价与屋顶开放按官网，15:40为目标票面时间。"]],"sources":["jrmap","metro-ueno","metro-asakusa","ginza","suica","metro","shibuya-sky-access","shibuya-sky-rules"]},"return":{"title":"返程机场 · 先确认商品，再交箱子","intro":"08:30–08:45离店；上野步行之外再留15–20分钟换票，选择最迟10:40到成田T1铁路站的目标班次。","steps":[["前一晚 · 确定班次，收好返程兑换券","确认8号目标Skyliner班次、CZ8310航班与行李额；把三人的返程兑换券、商品和购买记录整理好。"],["退房 → JR上野 → 京成上野","全部行李带走；JR南行到上野，出闸后拖箱步行10–15分钟转京成。"],["京成上野 · 换返程指定席","在步行之外再留15–20分钟，柜台向工作人员出示返程兑换券，换取所选班次的指定席；核对车次、车厢与座位后再进闸。"],["Skyliner → 成田T1","凭换得的车票乘车；目的地是成田空港第1航站楼，不是市区京成成田，也不是T2/3。"],["10:45–11:00到T1北翼4F","铁路站到出发大厅另留10–20分钟，按航班屏幕找柜台。"],["免税终端扫护照","绿色判定完成；红色按指引带商品接受查验，所有商品此时仍在自己手里。"],["确认完成 → 值机托运 → 安检出境","14:20起飞；实际登机时间与登机口看登机牌和机场屏幕。"]],"notes":[["往返优惠票的返程手续","成田首次兑换时领取去程车票和返程兑换券；返程上车前持该兑换券向工作人员换指定席。首次兑换时可询问能否提前指定返程，按现场答复办理；前晚先确认目标班次并保管好兑换券。"],["2026年11月起的退款制","符合资格、同店同日税前购满¥5,000等条件，先含税付款并登记；出境确认带出后按店方流程退款，不保证当场退现金。"],["购买记录要保持完整","同一购买记录中有商品未带出，该记录其他商品也不能退税。旅行中要使用的消耗品分开正常结账。"],["托运必须放在确认之后","不要先把含免税商品的箱子交给航空公司。需查验时，已交运的商品无法当场展示，不能靠取回箱子作为默认方案。"]],"sources":["airport","nrt","sky","tax","taxfaq","skyfaq"]}},"checklist":[{"id":"hotel","group":"现在可以准备","text":"确认两间房、12/5–7三晚和取消条款","note":"女生单间；两位男生是Twin / 2 beds，不是只写可住2人的Double。","route":"common"},{"id":"passport","group":"现在可以准备","text":"护照、适用签证与手机上网","note":"eVISA按官方要求联网展示；Visit Japan Web不代替签证。","route":"common"},{"id":"flight","group":"现在可以准备","text":"核对航班、航站楼和行李额","note":"沿用CZ8309 / CZ8310，出发前以航司通知确认。","route":"common"},{"id":"skyliner-online","group":"现在可以准备","text":"出发前网购3张Skyliner成人往返优惠票","note":"¥4,500/人、三人¥13,500，保存凭证并在成田T1首次兑换；领取去程车票＋返程兑换券，询问能否提前指定返程并收好票券。未预购标准去回合计¥5,160/人，当前预算用网购优惠。","route":"common"},{"id":"wishlist","group":"现在可以准备","text":"药妆列型号与容量，衣服记尺码","note":"旅行中要用的消耗品与准备退税带回的商品分开购买。","route":"common"},{"id":"fuji-ticket","group":"所选方案需要","text":"11/7上海09:00 · 富士回游指定席开售","note":"3张新宿07:30→下吉田09:13；3张河口湖17:41→新宿19:48。按实际可售班次买，不要把去程终点选成河口湖。","route":"fuji","verify":true},{"id":"fuji-pickup","group":"所选方案需要","text":"12/5–6提前领完整纸票","note":"取票后取消需柜台办理；不能再套用未取票网站免费取消。新宿旅行服务中心08:00开门，赶不上12/7的07:30车。","route":"fuji"},{"id":"fuji-weather","group":"所选方案需要","text":"12/5初判、12/6最终看富士五湖天气","note":"晴或晴间多云且实况能见山才选富士；已取票在柜台营业时段处理。未取票的JR-EAST Train Reservation订单免费取消截止12/6日本21:00（上海20:00）。","route":"fuji"},{"id":"yoko-ticket","group":"所选方案需要","text":"11/6上海11:00起买市集普通票3张","note":"12/7普通票现价每人¥500，饮食另付，线上购票仍可能排队。","route":"yokohama"},{"id":"yoko-wind","group":"所选方案需要","text":"查大栈桥风雨与AIR CABIN当天运行","note":"大栈桥15:00–16:55。缆车为可选¥1,000，12/7营业与最后受理待核实；停运或队长就走地面路线。","route":"yokohama","verify":true,"sources":["v4_air_cabin","v4_air_cabin_city","yokosun"]},{"id":"kama-train","group":"所选方案需要","text":"查08:33去程与18:05返程，确认均停赤羽／镰仓","note":"去程认逗子；回程认新宿経由。当前参考18:05→19:24，备用18:38→19:55，12/7再核对。","route":"kamakura","verify":true,"sources":["k_jr_outbound","v4_kama_return_1805","v4_kama_return_1838"]},{"id":"kama-hours","group":"所选方案需要","text":"查寺院开放、稻村崎风与云量","note":"12/7不默认夜枫。稻村崎15:45–16:55，16:29理论日落；厚云但风小时改由比滨，强风雨取消海岸。","route":"kamakura","sources":["k_hasedera_visit","k_kotoku_visit","v4_light_kamakura"]},{"id":"packing","group":"出发前72小时","text":"防风外套、保暖层、围巾手套与好走的鞋","note":"进入商场能脱一层；湖边和海边加防风，雨具随预报调整。","route":"common"},{"id":"camera","group":"出发前72小时","text":"82mm CPL、2块备用NP-FZ100、镜头布与备份设备","note":"电池放内侧口袋保暖；24mm用CPL观察天空是否深浅不均。小支架仅限允许场所，SKY不使用；每晚备份。","route":"common","sources":["v4_lens_82mm","v4_camera_battery","v4_cpl_guide"]},{"id":"offline","group":"出发前72小时","text":"下载此HTML、航班和酒店订单","note":"HTML内含正文与地图；实时导航、票务和官网需要联网。","route":"common"},{"id":"ic","group":"到达东京后","text":"三人各准备一张IC交通卡","note":"先充¥2,000–3,000，按余额补；另备少量现金给食券机。","route":"common"},{"id":"meeting","group":"到达东京后","text":"约好6号109本馆正门的会合方式","note":"想先购物者10:00到109；14:00本馆正门会合，15:10离店去SKY14F入口。","route":"common"},{"id":"return-seat","group":"7号晚上","text":"确定8号机场列车目标班次，收好返程兑换券","note":"12/8在京成上野柜台持券换指定席；JR上野步行10–15分钟之外，再留15–20分钟换票。目标最迟10:40到成田T1站、10:45–11:00到北翼4F。","route":"common"},{"id":"checkout-bag","group":"7号晚上","text":"把所有行李打包好，早餐提前想好","note":"酒店无寄存；早餐只顺路买，不挤压08:30–08:45离店、10:40到成田T1站。","route":"common"},{"id":"sky-ticket","group":"现在可以准备","text":"11/21上海23:00起抢12/6 SKY日落票3张","note":"按现行提前2周日本00:00规则，目标15:40场；成人参考¥3,400/人。先注册购票账号，开售规则与可售场次出发前复核。","route":"common","verify":true},{"id":"sky-conditions","group":"到达东京后","text":"6号检查SKY屋顶开放、票面与携带限制","note":"包与三脚架按要求寄存；相机装颈带。适用官网WEB票前一日可免费取消，屋顶关闭时入场前按官方条件办理。","route":"common","verify":true},{"id":"breakfast-prep","group":"到达东京后","text":"5号晚买好6号清晨早餐","note":"06:20在酒店吃完，06:40出发；临时采购不能拖慢浅草与SKY主线。","route":"common"},{"id":"din 吃晚饭时顺便买甜点","signature":"马卡龙、烧菓子","photo":null,"verify":true}],"photography":{"gear":["Sony A7C II + FE 24–70mm F2.8 GM II，RAW + JPEG；手持开防抖，稳定三脚架上按Sony指引处理","带82mm CPL：适度压低湖海和玻璃反光，24mm蓝天可能深浅不均；想拍倒影别把反光全滤掉，天暗后摘下","至少2块备用NP-FZ100放内侧口袋保暖；镜头布、遮光罩和充电设备一起装包","手机三脚架或八爪鱼支架可供三人定时合影，但SHIBUYA SKY等禁用场所不展开；公共通道不架设","每晚把当天照片备份到手机或移动硬盘","Godox T32非必带，不能照亮远山或楼群"],"presets":[{"id":"day_scenery","name":"白天建筑／湖岸","mode":"A档","aperture":"F5.6–8","iso":"AUTO 100–3200","shutter":"ISO AUTO Min.SS 1/125秒；70mm或风大用1/250秒","tip":"焦点放在建筑边缘、山脊或雕像。先看实际快门再拍，ISO到上限后仍可能比Min.SS更慢。"},{"id":"moving_street","name":"街头行人／浪花","mode":"A档","aperture":"F4–5.6","iso":"AUTO 100–6400","shutter":"Min.SS 1/250秒；快速动作试1/500秒","tip":"主体在动时需要快门速度；防抖不能冻住行人。必要时切M + Auto ISO固定速度。"},{"id":"night_static","name":"手持夜景静物","mode":"A档","aperture":"F2.8–4","iso":"AUTO 100–6400","shutter":"24–35mm从1/60秒试起；70mm或海风下加快","tip":"1/60秒只是试拍起点，不保证清楚。放大看文字和楼边，先保清晰，再考虑降低ISO。"},{"id":"night_moving","name":"夜间行人可选","mode":"M + ISO AUTO","aperture":"F2.8","iso":"AUTO 100–12800","shutter":"固定1/125–1/250秒","tip":"光圈和快门都固定时可用M + Auto ISO。容许ISO升高通常比明显拖影更实用；本册仍以景物为主。"}],"places":[{"id":"asakusa_main","name":"浅草寺本堂与宝藏门","route":"common","time":"12/6 07:25–08:15","subject":"建筑尺度、完整屋檐、灯笼与木纹","shots":[{"title":"先拍一张端正全景","focal":"24–35mm","composition":"在本堂前或宝藏门前开阔处，把屋檐与台基留完整；地面作前景、建筑作主角、少量人物作尺度。相机尽量放平，不要用过多空白天空填满画面。","settings":"A档F5.6–8，ISO AUTO 100–3200，最低快门1/125秒起。"},{"title":"灯笼与屋檐阴影","focal":"50–70mm","composition":"从侧前方选一组灯笼、木纹或屋檐层叠，只留下一个主角。晴天保留柱廊的明暗差，阴天侧重木纹和重复形状。","settings":"F4–5.6，70mm优先1/250秒；对焦在文字或清楚边缘。"},{"title":"宝藏门背面的大草鞋","focal":"35–50mm","composition":"过门后从不挡参拜的位置拍背面大草鞋，带入一根门柱表现尺度。先留完整轮廓，再用70mm补绳结纹理，不必把整座门塞入同一张。","settings":"F5.6；有走动人物用1/250秒。"}],"cautions":["先看参拜与拍摄标识；本页机位以室外建筑为主，不把室外可拍推广到殿内。","12月按现场树木状态构图，不保证红叶满树。"],"sources":[{"label":"浅草寺｜参拜","url":"https://www.senso-ji.jp/visit/"},{"label":"浅草寺｜宝藏门","url":"https://www.senso-ji.jp/guide/guide03.html"},{"label":"Sony A7C II｜ISO AUTO 最低快门","url":"https://helpguide.sony.net/ilc/2360/v1/en/contents/0408H_ISO_auto_minimun_SS.html"}],"compositionIdeas":["24–35mm：对齐门洞中轴，屋檐两端留一点空；地面只留到能交代人物尺度。","50–70mm：取一盏灯笼或一段木构，避开两侧杂物；阴天拍重复的屋檐与柱子。","雨天：把伞当作前景色块，让宝藏门留在画面上半部；快门从1/250秒起。"],"references":[{"asset":"ref-asakusa_main-01","caption":"宝藏门 · 正面中轴","composition":"看上下两重屋檐的对称关系；退后一点，把屋檐边缘完整留住。","credit":"Ocdp / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:Hozomon.jpg","license":"CC BY-SA 3.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0/","date":"2012-07-10","seasonNote":"夏季实景；参考中轴与屋檐，现场人流不同。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/e/e5/Hozomon.jpg","width":1100,"height":731,"changes":"按原比例缩小并压缩为JPEG；未增删画面元素。"},{"asset":"ref-asakusa_main-02","caption":"本堂 · 参道引导","composition":"地砖从下方引向本堂，用两侧建筑把视线收拢。","credit":"そらみみ（Soramimi） / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:Hondo_(Main_Hall)_of_Sensoji_Temple_2.jpg","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","date":"2015-09-15","seasonNote":"9月实景；12月按当天光线与树木状态取景。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/7/7d/Hondo_%28Main_Hall%29_of_Sensoji_Temple_2.jpg","width":1100,"height":825,"changes":"按原比例缩小并压缩为JPEG；未增删画面元素。"},{"asset":"ref-asakusa_main-03","caption":"宝藏门 · 雨伞前景","composition":"收紧画面，让伞与门形成前后两层；无需等到完全无人。","credit":"Basile Morin / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:Hozomon_with_visitors_under_their_umbrellas,_a_rainy_day_in_Tokyo,_Japan.jpg","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","date":"2019-06-07","seasonNote":"6月雨天作品；仅作雨天构图参考。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/8/88/Hozomon_with_visitors_under_their_umbrellas%2C_a_rainy_day_in_Tokyo%2C_Japan.jpg","width":1100,"height":733,"changes":"按原比例缩小并压缩为JPEG；未增删画面元素。"}]},{"id":"nakamise","name":"仲见世与雷门","route":"common","time":"12/6 07:25清晨＋09:30回逛","subject":"街道纵深、店招细节、雷门正面与局部","shots":[{"title":"重复屋檐带出街道","focal":"35–50mm","composition":"沿街边站，屋檐与招牌延伸向远处，前景少留杂物。等待人流出现空隙；不需要路上完全无人，一两位行人能交代街道尺度。","settings":"A档F4–5.6，ISO AUTO 100–6400，最低快门1/250秒。"},{"title":"一件点心、一把扇子","focal":"50–70mm","composition":"挑单个点心、扇子或招牌的纹理；靠近主体、让后方店铺退成背景。先观察侧光，避免包装反光把文字遮住。","settings":"F2.8–4拍单个细节，整盘或多件物品用F4–5.6；1/125秒起。"},{"title":"雷门的完整与局部","focal":"35mm / 70mm","composition":"35mm先拍灯笼与两侧门柱的对称关系，给灯笼底部留空；再用70mm取文字、绳结或门柱局部。减少天空能避免门内阴影与天空反差过大。","settings":"F5.6–8拍全景，F4–5.6拍细节；有人走动用1/250秒。"}],"cautions":["近拍店内商品或制作过程先问店家；不挡店门与参拜通道。","早间店铺开门时间不统一，主线先按街景与参拜安排。"],"sources":[{"label":"浅草寺｜参拜","url":"https://www.senso-ji.jp/visit/"},{"label":"Sony A7C II｜ISO AUTO 最低快门","url":"https://helpguide.sony.net/ilc/2360/v1/en/contents/0408H_ISO_auto_minimun_SS.html"}],"compositionIdeas":["35–50mm：沿街边找屋檐和招牌的消失点，等人流露出一小段路面。","雷门用24–35mm先拍正面，再侧移拍屋檐斜线；尽量让相机水平。","50–70mm：只取一块暖帘、灯笼或点心细节；近拍商品先问店家。"],"references":[{"asset":"ref-nakamise-01","caption":"仲见世 · 双侧屋檐","composition":"两侧招牌向远处收拢；让行人留在画面下半部。","credit":"Asturio Cantabrio / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:Asakusa_Nakamise_2021-12_ac.jpg","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","date":"原页标2021-12，EXIF日期不一致","seasonNote":"年末历史实景；装饰并非12月6日必有。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/4/48/Asakusa_Nakamise_2021-12_ac.jpg","width":1100,"height":731,"changes":"按原比例缩小并压缩为JPEG；未增删画面元素。"},{"asset":"ref-nakamise-02","caption":"雷门 · 侧前方","composition":"侧移后，屋檐形成斜线；灯笼与门柱仍是视觉中心。","credit":"Christophe95 / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:Kaminarimon_at_Sens%C5%8Dji.jpg","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","date":"2018-09-10","seasonNote":"9月实景；只参考门体关系与侧向透视。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/4/42/Kaminarimon_at_Sens%C5%8Dji.jpg","width":1100,"height":825,"changes":"按原比例缩小并压缩为JPEG；未增删画面元素。"}]},{"id":"asakusa_view","name":"浅草文化观光中心8F","route":"common","time":"12/6 09:00–09:25","subject":"仲见世中轴、屋顶图案与街区全景","shots":[{"title":"仲见世中轴竖幅","focal":"50–70mm","composition":"从展望位置朝仲见世方向拍，街道由下往上通向寺院。竖幅少留天空，把屋顶与街道组织成一条主线；边缘不要切断寺院主体。","settings":"A档F5.6–8，最低快门1/125秒；70mm手冷时1/250秒。"},{"title":"街区全景","focal":"24–35mm","composition":"横幅交代浅草街区，前方屋顶、中间街道、后方建筑分成三层。移动半步把栏杆排出画面，相机尽量水平。","settings":"F5.6–8；曝光先从0 EV开始，天空细节溢出才小幅减曝光。"},{"title":"屋顶的重复节奏","focal":"50–70mm","composition":"只截取一组重复屋顶、窗格或街巷线条，让画面变得简洁。阴天减少天空；晴天选择亮屋顶与暗街巷形成对比的区域。","settings":"F5.6，1/125–1/250秒；对焦在建筑边缘。"}],"cautions":["官方8F展望露台09:00–22:00；当天如有临时安排以现场为准。","若从玻璃内拍，镜头靠近但不碰玻璃，用深色衣物遮自身倒影，关闭闪光灯。"],"sources":[{"label":"台东区｜浅草文化观光中心","url":"https://www.city.taito.lg.jp/bunka_kanko/kankoinfo/info/oyakudachi/kankocenter/a-tic-gaiyo.html"},{"label":"Sony A7C II｜ISO AUTO 最低快门","url":"https://helpguide.sony.net/ilc/2360/v1/en/contents/0408H_ISO_auto_minimun_SS.html"}],"compositionIdeas":["24–35mm横幅：雷门放在下方，仲见世穿过街区，寺院留在远处，分出三层。","50–70mm：收紧到仲见世与寺院，少留天空；也可改竖幅突出街道中轴。","镜头靠近玻璃但别碰到，用深色衣物遮自己的倒影；先找没有栏杆挡住的位置。"],"references":[{"asset":"ref-asakusa_view-01","caption":"8F展望 · 街区全景","composition":"雷门、仲见世、寺院由近及远；街道稍偏一侧，留出周围街区。","credit":"Christophe95 / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:View_to_the_north_from_the_Asakusa_Culture_Tourist_Information_Center_in_Tokyo.jpg","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","date":"2018-09-10","seasonNote":"9月实景，来自浅草文化观光中心；不是无人机视角。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/0/03/View_to_the_north_from_the_Asakusa_Culture_Tourist_Information_Center_in_Tokyo.jpg","width":1100,"height":825,"changes":"按原比例缩小并压缩为JPEG；未增删画面元素。"},{"asset":"ref-asakusa_view-02","caption":"8F展望 · 屋顶与寺院","composition":"减少前方街区，强调绿色屋顶通向寺院；70mm可先取相近关系，再按需要裁切。","credit":"Christophe95 / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:View_of_Sens%C5%8D-ji_from_the_Asakusa_Culture_Tourist_Information_Center.jpg","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","date":"2018-09-10","seasonNote":"9月实景；参考收紧后的构图关系，不把原作焦段当成24–70mm实拍参数。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/f/fd/View_of_Sens%C5%8D-ji_from_the_Asakusa_Culture_Tourist_Information_Center.jpg","width":1100,"height":825,"changes":"按原比例缩小并压缩为JPEG；未增删画面元素。"}]},{"id":"azuma","name":"吾妻桥与隅田川","route":"common","time":"12/6 08:25–08:50","subject":"桥、河面、晴空塔和船的层次","shots":[{"title":"桥把视线带向城市","focal":"24–35mm","composition":"在西岸开放步道的宽处找角度，河面作前景、桥作斜线、晴空塔与楼群在后。不要把所有河面都留进来，先让桥的方向清楚。","settings":"A档F5.6–8，最低快门1/125秒；风大改1/250秒。"},{"title":"晴空塔与楼群竖幅","focal":"50–70mm","composition":"用竖幅减少两侧杂物，给塔尖留空；移动几步分开塔、楼群与桥柱的轮廓。远景偏灰时不要只靠大幅加曝光。","settings":"F5.6–8，1/250秒优先；检查塔身是否清楚、地平线是否歪。"},{"title":"等一艘船进入下方","focal":"35–50mm","composition":"构图先固定，留出下方河面，等船走进画面再拍。逆光时可让船成为剪影，保留水面亮带，不必同时照亮每个建筑阴影。","settings":"F5.6，1/250–1/500秒；没有船时拍桥与水纹也成立。"}],"cautions":["清晨浅草侧朝东拍晴空塔容易逆光；接受剪影，不强求顺光。","站在宽处拍，不停在桥头通行口；不为取景把器材放到栏杆外。","船只、倒影和清晰度取决于现场，不保证出现特定水上活动。"],"sources":[{"label":"台东区｜浅草文化观光中心与周边信息","url":"https://www.city.taito.lg.jp/bunka_kanko/kankoinfo/info/oyakudachi/kankocenter/a-tic-gaiyo.html"},{"label":"Sony｜曝光补偿","url":"https://www.sony.com.au/support/resources/en_AP/html/Usefulinfo/BasicImgTech/2/22/exposure_adjustment.html"},{"label":"Sony A7C II｜ISO AUTO 最低快门","url":"https://helpguide.sony.net/ilc/2360/v1/en/contents/0408H_ISO_auto_minimun_SS.html"}],"compositionIdeas":["24–35mm：在西岸宽阔步道取桥、河面与晴空塔；桥别压在画面正中，塔尖留空。","50–70mm：缩小河面比例，让塔与朝日大楼形成疏密对比；移动几步，避免轮廓重叠。","先固定背景，若有船经过，就等它进入下方空位；船头前方多留一点空间。"],"references":[{"asset":"ref-azuma-01","caption":"吾妻桥 · 河岸全景","composition":"桥放在画面下方，晴空塔与楼群组成高低错落的轮廓。","credit":"Kakidai / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:Azuma_Bridge_2.jpg","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","date":"2018-11","seasonNote":"11月实景；取景范围参考，实际能见度以当天为准。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/d/d9/Azuma_Bridge_2.jpg","width":1100,"height":736,"changes":"按原比例缩小并压缩为JPEG；未增删画面元素。"},{"asset":"ref-azuma-02","caption":"吾妻桥 · 船与楼群","composition":"建筑作为背景，河船作为前景；给船的运动方向留空。","credit":"Kakidai / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:Skytree_%26_Asahi_Breweries_Building,_from_Azumabashi,_Asakusa_%E2%85%A3.JPG","license":"CC BY-SA 3.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0/","date":"2012-05-27","seasonNote":"5月历史实景；船型、班次与背景细节可能变化。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/1/19/Skytree_%26_Asahi_Breweries_Building%2C_from_Azumabashi%2C_Asakusa_%E2%85%A3.JPG","width":1100,"height":779,"changes":"按原比例缩小并压缩为JPEG；未增删画面元素。"}]},{"id":"shibuya","name":"涩谷：街景、夜灯与雨天","route":"common","time":"12/6 17:30–18:20","subject":"斑马线、城市尺度、109外观、灯牌与反射","shots":[{"title":"路口的三层关系","focal":"35–50mm；广角补24–28mm","composition":"从人行道拍斑马线前景、行人中景、楼群背景，等一位人物进入空处。广角版强调城市尺度，尽量把相机放平；过街时正常通行。","settings":"A档F4–5.6，ISO AUTO 100–6400，最低快门1/250秒。"},{"title":"109白天与点灯后对照","focal":"35–50mm；细节70mm","composition":"在安全开阔处拍购物的SHIBUYA109本馆外立面与入口，记住站位和画面边缘，点灯后再拍一张。70mm补招牌、橱窗纹理或衣服细节。","settings":"白天F5.6；点灯后F2.8–4，静物1/60秒起，有人移动用1/125–1/250秒。"},{"title":"夜间灯牌分层","focal":"50–70mm；静物优先24–35mm","composition":"灯牌、人物剪影、后方楼群分成三层，只选一块招牌作主角。约16:28日落后，先拍天空仍有层次的街景，再拍更暗的灯牌局部。","settings":"F2.8–4，ISO AUTO 100–6400；从0 EV开始，灯牌过亮再试−0.3或−0.7EV。"},{"title":"湿地面与橱窗反射","focal":"35–70mm","composition":"雨天略放低机位拍一处倒影，不蹲在主通道。拍玻璃先决定主角是倒影还是窗内物品，对焦在选定的一层；要消除自己的倒影可用深色衣物遮光。","settings":"F2.8–4；灯光变成脏光斑先擦前镜片水滴，不要只调整参数。"}],"cautions":["本馆SHIBUYA109与路口另一栋MAGNET by SHIBUYA109不同；历史街景照片只参考构图，不按旧招牌认路。","商场内拍摄以店家与现场标识为准，不挡入口；地面机位已足够，不要求另购观景台门票。","A档最低快门非硬性下限，夜间尤其要看实际速度。"],"sources":[{"label":"SHIBUYA109｜常见问题","url":"https://shibuya109.jp/qa/"},{"label":"国立天文台｜东京2026年12月","url":"https://eco.mtk.nao.ac.jp/koyomi/dni/2026/s1312.html"},{"label":"Sony｜反射构图","url":"https://alphauniverse.com/videos/street-photography-pro-tip--use-reflections/"},{"label":"Sony｜曝光补偿","url":"https://www.sony.com.au/support/resources/en_AP/html/Usefulinfo/BasicImgTech/2/22/exposure_adjustment.html"},{"label":"Sony A7C II｜ISO AUTO 最低快门","url":"https://helpguide.sony.net/ilc/2360/v1/en/contents/0408H_ISO_auto_minimun_SS.html"}],"compositionIdeas":["35–50mm：在人行道边拍斑马线、人群、楼群三层，等人群分开后再按快门。","日落后用24–35mm拍一组亮灯建筑，天空保留一点蓝；F2.8–4，静物从1/60秒试拍。","50–70mm只选一块灯牌作主角；有人经过时用1/125–1/250秒，别靠压低ISO换来拖影。"],"references":[{"asset":"ref-shibuya-01","caption":"涩谷路口 · 人流层次","composition":"斑马线、人群、招牌分成三层；原作为超广角，24mm取较窄范围保留同样层次。","credit":"N509FZ / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:Shibuya_Crossing_from_the_northeast_(20230805172403).jpg","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","date":"2023-08-05","seasonNote":"8月傍晚实景；广告牌、人流与季节光线会变化。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/a/a0/Shibuya_Crossing_from_the_northeast_%2820230805172403%29.jpg","width":1100,"height":734,"changes":"按原比例缩小并压缩为JPEG；未增删画面元素。"},{"asset":"ref-shibuya-02","caption":"涩谷路口 · 蓝调灯牌","composition":"看斑马线的方向和蓝天、灯牌的明暗关系；24–35mm可选取较小的一组楼群。","credit":"Kakidai / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:2025_Shibuya_Crossing_at_night.jpg","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","date":"2025-08-30","seasonNote":"8月蓝调作品，原作视角较广；参考层次，不要求24mm复刻全部楼群。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/6/6c/2025_Shibuya_Crossing_at_night.jpg","width":1100,"height":879,"changes":"按原比例缩小并压缩为JPEG；未增删画面元素。"}]},{"id":"oishi","name":"大石公园","route":"fuji","time":"12/7 11:45–12:25","subject":"富士山、湖面、岸边草木与雪线","shots":[{"title":"先留山与湖的清楚全景","focal":"50–70mm","composition":"山体为主，湖面约放下方1/3，峰顶留空。山一露出先拍，不等完美云层或完全无人的前景。","settings":"A档F5.6–8，ISO AUTO 100–3200，最低快门1/125秒；70mm或风大用1/250秒。"},{"title":"一小片前景就够","focal":"24–35mm","composition":"从开放步道取一小片岸边草木或岸线，近景、湖面、远山分层。放低机位前确认草没有遮住峰顶，冬季枯枝也可以成立。","settings":"F8起步；焦点优先放在山体，特别近的草不必和远山同时锐利。"},{"title":"云边与雪线","focal":"70mm","composition":"去掉杂乱岸边，只留山脊、雪线和云。云边与山脊分开时按快门；明亮雪纹消失才减一点曝光，大面积雪拍灰时可以加一点。","settings":"F5.6–8，1/250秒；不要固定“雪景一律+1EV”。"},{"title":"岸线与水平关系","focal":"35–50mm","composition":"用岸线从画面下角引向远山，拍完放大确认山脊清楚，并检查湖岸与地平线是否倾斜。逆光时让太阳留在画外，减少耀斑。","settings":"F5.6–8；阴天少留天空，风大优先快门，不为低ISO牺牲清晰。"}],"cautions":["此行近正午到访；倒影、积雪与能见度随当天条件变化，12月不按夏季花海期待。","云遮山时拍岸边与湖面即可，不为等云压缩返程。"],"sources":[{"label":"富士河口湖观光｜大石公园","url":"https://fujisan.ne.jp/sightseeing/1652/"},{"label":"Sony｜曝光补偿","url":"https://www.sony.com.au/support/resources/en_AP/html/Usefulinfo/BasicImgTech/2/22/exposure_adjustment.html"},{"label":"Sony A7C II｜ISO AUTO 最低快门","url":"https://helpguide.sony.net/ilc/2360/v1/en/contents/0408H_ISO_auto_minimun_SS.html"}],"compositionIdeas":["50–70mm：先拍完整山体，湖面放下方约三分之一，峰顶留一点呼吸。","24–35mm：岸草只占一小段前景，让近岸、湖面、富士山分成三层。","云层遮山时改拍水纹和岸线；山露出来先按快门，不一直等完美倒影。"],"references":[{"title":"Mount Fuji from Oishi Park.jpg","asset":"ref-oishi-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/0/04/Mount_Fuji_from_Oishi_Park.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Mount_Fuji_from_Oishi_Park.jpg","credit":"Alpsdake","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","date":"Taken on 26 October 2015, 08:35:31","description":"Lake Kawaguchi and Mount Fuji seen from Oishi Park in Fujikawaguchiko, Yamanashi Prefecture, Japan.","width":1100,"height":733,"size":184933,"caption":"岸草、湖面与远山","composition":"前景只占下方一小段，湖与山之间留出明确层次。","seasonNote":"2015年10月；12月草木、积雪和能见度以当天为准。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"},{"title":"Kawaguchiko, Part III - Kawaguchiko6776.jpg","asset":"ref-oishi-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/f/fd/Kawaguchiko%2C_Part_III_-_Kawaguchiko6776.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Kawaguchiko,_Part_III_-_Kawaguchiko6776.jpg","credit":"lumoplank","license":"CC0","licenseUrl":"http://creativecommons.org/publicdomain/zero/1.0/deed.en","date":"12 November 2025","description":"Mount Fuji viewed across Lake Kawaguchi.","width":1100,"height":733,"size":125191,"caption":"暮色中的山形","composition":"少留岸边杂物，用明暗分层突出完整山体。","seasonNote":"2025年11月傍晚；本行程近正午到访，参考山湖比例，光线不同。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"}]},{"id":"ubuyagasaki","name":"产屋崎","route":"fuji","time":"12/7 14:00–14:45","subject":"树枝框景、简洁山湖与弯曲岸线","shots":[{"title":"树枝只从边缘进入","focal":"35–50mm","composition":"从允许通行的湖岸位置找侧边枝条作框景，峰顶附近保持干净。先看完整构图，再检查有无枝条横穿山尖。","settings":"A档F5.6–8，ISO AUTO 100–3200，最低快门1/125秒起。"},{"title":"山、湖、少量天空","focal":"50–70mm","composition":"把画面简化成山与湖的两大块，少留无层次天空。沿开放步道移动几步避开杂物，不需要走进岸边禁入处。","settings":"F5.6–8，1/250秒优先；对焦在山脊。"},{"title":"岸线引向远山","focal":"24–35mm","composition":"让弯曲岸线由下角进入，湖面为中景，山体为背景。拍摄高度略降即可，不进入湿滑岸石或围挡。","settings":"F8；山体较暗时先保护亮云和雪纹，再决定是否加少量曝光。"}],"cautions":["14:45收机，沿大桥合法人行道去大池公园；若早返，先改票，再去站13候14:52巴士。","12月不把春季樱花框景当作保证；冬树和湖岸本身就是主题。","厚云挡山不会因提高ISO或换焦段而消失。"],"sources":[{"label":"富士山观光｜产屋崎","url":"https://www.fujisan-kyokai.jp/viewspot50/296"},{"label":"Sony｜曝光补偿","url":"https://www.sony.com.au/support/resources/en_AP/html/Usefulinfo/BasicImgTech/2/22/exposure_adjustment.html"},{"label":"Sony A7C II｜ISO AUTO 最低快门","url":"https://helpguide.sony.net/ilc/2360/v1/en/contents/0408H_ISO_auto_minimun_SS.html"}],"compositionIdeas":["35–50mm：找边缘枝条作框景，山尖附近保持干净；冬季枯枝也能用。","50–70mm：去掉杂乱近岸，只留雪线、山体和一条湖面。","24–35mm：让岸线从下角进入，向远山延伸；以开放步道内的位置为准。"],"references":[{"title":"Mt. Fuji view from Lake Kawaguchi.jpg","asset":"ref-ubuyagasaki-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/6/6b/Mt._Fuji_view_from_Lake_Kawaguchi.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Mt._Fuji_view_from_Lake_Kawaguchi.jpg","credit":"Volfgang","license":"CC BY-SA 3.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","date":"4 November 2009 (according to Exif data)","description":"Mt. Fuji view from Ubuyagasaki, Lake Kawaguchi, Yamanashi, Japan.","width":1100,"height":789,"size":167283,"caption":"湖面高光与富士山","composition":"湖面占下半部，山体略高于中心，让亮带把视线带向山。","seasonNote":"2009年11月；湖面亮带随太阳与风况变化。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"},{"title":"Mount Fuji and cherry blossoms from Ubuyagasaki, Lake Kawaguchi on April 15, 2016.jpeg","asset":"ref-ubuyagasaki-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/e/e0/Mount_Fuji_and_cherry_blossoms_from_Ubuyagasaki%2C_Lake_Kawaguchi_on_April_15%2C_2016.jpeg","pageUrl":"https://commons.wikimedia.org/wiki/File:Mount_Fuji_and_cherry_blossoms_from_Ubuyagasaki,_Lake_Kawaguchi_on_April_15,_2016.jpeg","credit":"Hrykt","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","date":"2016-04-15 07:17:38","description":"河口湖、産屋ヶ崎からの桜と富士山 2016年4月15日","width":1000,"height":750,"size":224963,"caption":"树枝框景","composition":"枝条从上方和侧边围入，山尖周围保留干净空隙。","seasonNote":"2016年4月樱花照片；12月没有樱花，可改用冬枝。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"},{"title":"Mt.fuji - panoramio (1).jpg","asset":"ref-ubuyagasaki-3","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/1/10/Mt.fuji_-_panoramio_%281%29.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Mt.fuji_-_panoramio_(1).jpg","credit":"Babiesan","license":"CC BY-SA 3.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","date":"Taken on 18 December 2009","description":"Mt.fuji","width":1100,"height":730,"size":96205,"caption":"冬季雪线与山体","composition":"简化成山、湖、天空三层，突出山脊与雪线。","seasonNote":"2009年12月冬晨作品；本行程下午到访，参考山湖比例，光线不同。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"}]},{"id":"osanbashi","name":"横滨大栈桥","route":"yokohama","time":"12/7 15:00–16:55","subject":"木甲板线条、港未来天际线与海面","shots":[{"title":"甲板曲线与人物尺度","focal":"24–28mm","composition":"弯曲木纹从下方角落引向建筑，带一位很小的人物作尺度，前景不要全是空地。先拍水平完整的环境图，再改变高低机位。","settings":"A档F5.6–8，ISO AUTO 100–3200，最低快门1/125秒；海风大用1/250秒。"},{"title":"天际线与天空平衡","focal":"35–50mm","composition":"楼群放在中下部，天空平淡就少留，云层有层次再增加天空比例。约16:30前后每隔10分钟拍一次同一画面，比较天光与灯光。","settings":"F5.6起，逐渐变暗可F4；看实际快门，不执着低ISO。"},{"title":"摩天轮、屋顶和楼群","focal":"70mm","composition":"挑摩天轮与楼群或红砖屋顶的关系，左右移动几步分开重叠轮廓。用中长焦压缩层次，不必每栋楼都拍进去。","settings":"F5.6，1/250秒优先；天黑后可F2.8–4、ISO AUTO 100–6400。"},{"title":"海面与船","focal":"24–35mm","composition":"海面作为前景，船若经过就放在下方一侧，楼群作背景。没有船时拍水面亮带，不一直等待；逆光保留海面高光与建筑轮廓。","settings":"F5.6；静物1/125秒起，有船移动用1/250秒。"}],"cautions":["12/7横滨日落16:28，主线留到16:55覆盖约27分钟余晖。想等更深夜色，可留到17:15并缩短市集约20分钟。","本攻略按手持随拍设计；布置器材或正式拍摄查场地规则，不把普通随拍说明扩大成可随意架设。","历史夜景图中的船和灯饰不保证当天相同，海风大时可缩短停留。"],"sources":["v4_yoko_night","v4_osanbashi_photo","yokosun","v4_sony_min_shutter"],"compositionIdeas":["24–28mm：降低一点机位，让木甲板接缝从下角伸向楼群。","35–50mm：港未来天际线放在下半部，天空有层次才多留。","70mm：挑摩天轮与一两栋楼形成局部，挪几步让建筑轮廓不重叠。"],"references":[{"title":"Yokohama osanbashi 20061210.jpg","asset":"ref-osanbashi-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/e/e4/Yokohama_osanbashi_20061210.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Yokohama_osanbashi_20061210.jpg","credit":"Los688","license":"Public domain","licenseUrl":"https://commons.wikimedia.org/wiki/File:Yokohama_osanbashi_20061210.jpg","date":"2006-12-10","description":"横浜・大桟橋上部 2006年12月10日撮影","width":1000,"height":665,"size":110077,"caption":"木甲板的引导线","composition":"木纹与坡道从近处伸向远处，人物只作尺度。","seasonNote":"2006年12月历史实景；建筑与现场布置以当前为准。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"},{"title":"Yokohama cityscape at dawn; 2015.jpg","asset":"ref-osanbashi-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/7/79/Yokohama_cityscape_at_dawn%3B_2015.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Yokohama_cityscape_at_dawn;_2015.jpg","credit":"aotaro from Yokohama, Japan","license":"CC BY 2.0","licenseUrl":"https://creativecommons.org/licenses/by/2.0","date":"2015-12-26 17:07","description":"Yokohama cityscape at dawn, taken at Osanbashi Pier, Yokohama, Japan.","width":1100,"height":733,"size":104846,"caption":"港未来蓝调天际线","composition":"楼群压在下方，让余晖与天空形成上下色层。","seasonNote":"2015年12月约17:07历史实景；这次16:55离开，借鉴天际线布局，现场天色与亮灯不同。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"}]},{"id":"akarenga","name":"横滨红砖仓库","route":"yokohama","time":"12/7 17:25–19:00","subject":"砖墙、灯饰、重复窗框与热食","shots":[{"title":"建筑与入口人流","focal":"24–35mm","composition":"正对外立面或稍偏一侧，保持竖线端正；建筑为主、灯串在上、入口人流在下。灯光亮处有细节才是重点，不必把暗砖墙全部提亮。","settings":"A档F2.8–4，ISO AUTO 100–6400；静物1/60秒起，行人1/125–1/250秒。"},{"title":"一排窗或一组拱门","focal":"35–50mm","composition":"拱门、窗框和砖墙只选一排，利用重复形成节奏。平行建筑拍更端正，斜拍时让线条收向同一方向。","settings":"F4–5.6，手持快门优先；对焦在砖纹或窗框边缘。"},{"title":"近处灯饰与远处散景","focal":"50–70mm","composition":"对准一个近处装饰，让远处灯串退成背景。靠近主体通常比盲目拉长焦更明显，先确认近处细节和店家标识允许拍摄。","settings":"F2.8–4，1/125秒起；拍完检查主体清楚，而非只有灯光好看。"},{"title":"热食的蒸汽与纹理","focal":"50–70mm","composition":"侧上方约45°拍食物，选择侧光或侧后光让蒸汽显形。整盘保完整边缘，单个细节再收紧画面，吃热食前拍一两张即可。","settings":"整盘F4–5.6，局部F2.8–4；1/125秒起，不用直射闪光。"}],"cautions":["摊位与灯饰布置以当年现场为准；不为拍照占据排队或用餐位置。","海风大时先暖手，优先24–35mm和更快快门；灯光周围有脏光斑先擦镜头水滴。"],"sources":["market","v4_sony_min_shutter"],"compositionIdeas":["24–35mm：稍偏一侧拍仓库，砖墙沿对角线延伸；检查竖线别歪。","35–50mm：正对一排亮窗，让重复窗框成为节奏，少留黑天空。","50–70mm：用一串灯或一份热食作近景，仓库灯光退成背景。"],"references":[{"title":"20250102 Yokohama Red Brick Warehouse 205307.jpg","asset":"ref-akarenga-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/e/e4/20250102_Yokohama_Red_Brick_Warehouse_205307.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:20250102_Yokohama_Red_Brick_Warehouse_205307.jpg","credit":"Matthide127","license":"CC0","licenseUrl":"http://creativecommons.org/publicdomain/zero/1.0/deed.en","date":"2025-01-02 20:53:10","description":"Magazyn z czerwonej cegły w Jokohamie","width":1100,"height":825,"size":154897,"caption":"夜间亮窗与横向节奏","composition":"用一排亮窗带出仓库长度，暗天空少留一点。","seasonNote":"2025年1月；圣诞布置与灯饰每年不同。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"},{"title":"20250101 Yokohama Red Brick Warehouse 115801.jpg","asset":"ref-akarenga-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/2/2d/20250101_Yokohama_Red_Brick_Warehouse_115801.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:20250101_Yokohama_Red_Brick_Warehouse_115801.jpg","credit":"Matthide127","license":"CC0","licenseUrl":"http://creativecommons.org/publicdomain/zero/1.0/deed.en","date":"2025-01-01 11:58:01","description":"Magazyn z czerwonej cegły w Jokohamie","width":1000,"height":750,"size":164094,"caption":"砖墙的斜向延伸","composition":"侧前方的砖墙、窗框与地面一起向远处延伸；24mm缩小取景范围，保留同样斜线。","seasonNote":"2025年1月白天；这次晚间到访，可借用角度和线条。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"}]},{"id":"tsurugaoka","name":"鹤冈八幡宫","route":"kamakura","time":"12/7 10:10起，先参拜再拍室外","subject":"参道纵深、石阶层次、朱色建筑与冬树","shots":[{"title":"段葛的树列与参道","focal":"35–50mm","composition":"若宫大路的段葛，选择不会挡住来往行人的一侧，朝八幡宫方向拍。 横幅中远景；用近处步道作前景，两侧树列作中景，远处鸟居或参道终点作背景。让线条从下方收向远处，少留无细节天空。 光线：晴天先观察哪一侧树干有侧光，保留亮树干与暗背景的区别；逆光时把太阳藏到树干后，避免整片画面泛白。","settings":"F5.6–8；静景1/125秒起，有行人穿过则1/250秒。"},{"title":"源平池边的桥、水面和冬树","focal":"35–50mm；局部可用70mm","composition":"三之鸟居以内、源平池旁允许通行的池边步道，寻找桥与水面的关系。 横幅中景；桥放在画面中部偏一侧，少量池岸或枝条放前景，水面作为留白。移动半步，避免树枝横穿桥顶。 光线：光线平淡时拍桥与倒影的几何关系；水面反光太白就换一点站位，或只取较暗水面与树影。","settings":"F5.6；不需要为了倒影特意用慢快门。"},{"title":"舞殿与后方建筑层次","focal":"35–50mm","composition":"舞殿前广场的外缘，选择不进入仪式区域、不挡参道的位置。 横幅中景；舞殿作主要建筑，后方石阶与楼门交代纵深。屋檐留完整，尽量保持相机水平。 光线：屋檐下偏暗时不要一味把阴影提到与天空一样亮；保留柱廊明暗，检查屋顶高光是否有纹理。","settings":"F5.6–8，ISO AUTO；先拍无人物或人物较少的一张。 有婚礼或祭典时，改拍建筑侧面和周边树木，不拍仪式近景。"},{"title":"大石阶与楼门外观","focal":"50–70mm","composition":"大石阶下方平地的侧边，朝上方楼门取景；不在阶梯途中停留。 竖幅或紧凑横幅；石阶占下方，楼门占上方，侧边留少量树木。利用长焦减少无关地面，不必把门内拍清。 光线：冬季低角度光可能令阶梯产生连续阴影，可让阴影成为节奏；若楼门背光，优先保屋檐与天空，接受内部较暗。","settings":"F5.6，1/125–1/250秒；70mm先检查手震。 此机位仅拍室外楼门与石阶，不安排本殿内部、参拜人员或祈祷过程的拍摄。"}],"cautions":["现行全年06:00–20:00；官网2024年3月31日公告自4月1日起楼门按此开闭。不要沿用旧网页的冬季06:00–21:00。","官网规定：境内及段葛，超出个人观赏范围的拍摄、业务或公开目的等拍摄及取材，须事先取得许可。","官方神前婚礼摄影说明要求殿内不拍摄，并请勿在境内使用三脚架、一脚架、梯凳等；本攻略一律按手持、室外环境记录设计，不安排仪式近拍。","先参拜再拍外观，避开祈祷与婚礼过程，不把参拜队伍当作摆拍背景。","在石阶下或平坦开阔处取景，不在大石阶中段停下布置相机；通行和现场工作人员指示优先。","细雨可缩短参道远景，保留池边水纹、湿石阶和屋檐细节；雨大时短参拜后到小町通营业中的店铺休息，不在殿内寻找替代拍摄机位。","12月以树干和枝条线条为主，不是樱花隧道。","倒影取决于风，冬季不承诺荷花或满池绿叶。"],"sources":[{"label":"鹤冈八幡宫：开闭门时间更改公告","url":"https://www.hachimangu.or.jp/activity/news/952"},{"label":"鹤冈八幡宫：境内取材与摄影","url":"https://www.hachimangu.or.jp/activity/news/631"},{"label":"鹤冈八幡宫神前婚礼·莺吟亭：摄影","url":"https://ougintei.jp/photo/"},{"label":"鹤冈八幡宫：观光与现行开门时间","url":"https://www.hachimangu.or.jp/sightseeing/"}],"compositionIdeas":["24–35mm：站在不挡路的位置拍舞殿，保留完整屋檐和台基，前后建筑形成层次。","35–50mm：池岸与桥作引导线，树枝只从画面边缘进入。","50–70mm：取朱红门柱、灯笼或匾额的一处细节，避免把所有纹样挤进一张。"],"references":[{"title":"Tsurugaoka Hachimangu.jpg","asset":"ref-tsurugaoka-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/8/88/Tsurugaoka_Hachimangu.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Tsurugaoka_Hachimangu.jpg","credit":"Syced","license":"CC0","licenseUrl":"http://creativecommons.org/publicdomain/zero/1.0/deed.en","date":"15 January 2025 (according to Exif data)","description":"Tsurugaoka Hachimangu","width":1000,"height":753,"size":202075,"caption":"冬树与源平池","composition":"池岸形成弧线，树枝轻轻围住水面。","seasonNote":"2025年1月；12月叶色与水面状态不同。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"},{"title":"Tsurugaoka-hachimangu maiden 20261018.jpg","asset":"ref-tsurugaoka-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/2/25/Tsurugaoka-hachimangu_maiden_20261018.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Tsurugaoka-hachimangu_maiden_20261018.jpg","credit":"VZP10224","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","date":"2026-10-18 11:24:33","description":"鶴岡八幡宮舞殿","width":1000,"height":753,"size":191065,"caption":"舞殿的正面层次","composition":"保留对称屋檐，背景台阶与殿宇自然延伸。","seasonNote":"2026年10月；祭典、围挡与人流以现场为准。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"}]},{"id":"komachi","name":"小町通","route":"kamakura","time":"12/7 10:55起，11:30午餐前后顺路拍","subject":"招牌、店铺节奏、食物纹理与街道纵深","shots":[{"title":"入口与街道纵深","focal":"35–50mm","composition":"镰仓站东口一侧进入小町通后，先走离最拥挤的入口再寻找路边空位。 横幅中景；近处一块招牌或屋檐作框，街上行人为中景，连续店招延伸到远处。画面只强调一条街道方向。 光线：招牌受光、路面在阴影时，让亮处成为主角；不要为了提亮所有路人而把招牌拍成白块。","settings":"F4–5.6，1/250秒起；以街景为主，不追拍陌生人面部。 靠边拍、拍完即走，不为了居中构图站在通道中央或倒退行走。"},{"title":"一间店的外观","focal":"35–50mm","composition":"选择门前不拥堵且店家允许拍摄的一家店，从斜前方或正面拍外立面。 中景；保留招牌、入口、门帘三个元素即可。竖线尽量端正，画面边缘不要切掉招牌的关键字。 光线：阴天适合拍整块外立面，颜色较均匀；晴天挑亮暗交界少的角度，避免一半招牌死黑、一半反光。","settings":"F5.6；无人经过时1/125秒，带路人则1/250秒。 不占用店门口或排队位置。"},{"title":"点心与热食纹理","focal":"50–70mm","composition":"在购买店铺指定的用餐位置，征得允许后拍自己买的食物。 近景；约45°侧上方拍一件食物，桌面或包装作简洁背景。整盘用F4–5.6，单个纹理可F2.8。 光线：把食物移到窗侧的柔光里，让光从侧后方照出蒸汽；不要用直射闪光抹平纹理。","settings":"1/125秒起；有明显蒸汽动态可1/250秒，拍一张后先吃热食。 不用食物挡住通道摆拍，也不把开口杯和食物带入后续高德院。"},{"title":"玻璃与雨天倒影","focal":"50–70mm","composition":"允许停留的橱窗外侧或宽处，选择一块干净玻璃与湿地面。 细节；选择倒影或窗内物品其中一层做主角，另一层只作为气氛。不要同时把每层都拍得杂乱。 光线：想消除自己的倒影，靠近但不碰玻璃，并用深色衣物遮住身后的亮面；想保留反射，则稍离玻璃让街景融入。","settings":"F2.8–4；对焦区域放在选定的一层，拍后放大确认。 擦掉镜头前片水滴后再拍灯光，避免脏光斑。"}],"cautions":["商店街没有统一营业或休业安排；商店会明确各店自行安排。不要把商店街写成所有店铺统一09:00开门。","商店会请游客把垃圾交回购买店铺或带走，并请勿边吃喝边进入其他店铺。","媒体取材有专门申请渠道；普通旅行拍店内、橱窗细节或制作过程前，先征得店家同意。后一句为本攻略礼仪建议。","早到店未开时拍街道与招牌，不把购物硬塞在清晨；上午下雨可延长午餐或营业中咖啡店停留，但小町通本身不是全程有顶棚的室内街。"],"sources":[{"label":"镰仓小町商店会","url":"https://kamakura-komachi.com/"},{"label":"镰仓市观光协会：小町通","url":"https://www.trip-kamakura.com/facility/detail.php?id=169"},{"label":"Sony Alpha Universe：利用反射构图","url":"https://alphauniverse.com/videos/street-photography-pro-tip--use-reflections/"}],"compositionIdeas":["35–50mm：站在街边，让两侧店招与屋檐汇向远处；等人流出现一小块空隙。","50–70mm：挑一面招牌或一件点心，把杂乱街道留在虚化背景。","竖幅强调街道纵深，横幅交代购物气氛；拍完立刻让出通行位置。"],"references":[{"title":"Komachi dori in Kamakura 2025 09.jpg","asset":"ref-komachi-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/c/c9/Komachi_dori_in_Kamakura_2025_09.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Komachi_dori_in_Kamakura_2025_09.jpg","credit":"Olaf2","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","date":"12 April 2025, 16:06:30","description":"Komachi dori in Kamakura 2025","width":837,"height":1100,"size":193667,"caption":"竖幅街道纵深","composition":"两侧店招向中间汇聚，人物分布在前、中、远景。","seasonNote":"2025年4月；不按旧店招认路。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"},{"title":"Komachi-dori Street - Kamakura - 2026 Oct 1 various 1.jpg","asset":"ref-komachi-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/e/ec/Komachi-dori_Street_-_Kamakura_-_2026_Oct_1_various_1.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Komachi-dori_Street_-_Kamakura_-_2026_Oct_1_various_1.jpg","credit":"Nesnad","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","date":"1 October 2026, 16:01:02","description":"Komachi-dori Street in Kamakura","width":1100,"height":825,"size":168676,"caption":"街边看向小町通","composition":"两侧建筑拉出街道纵深；原作用超广角，24–35mm取较窄街景即可。","seasonNote":"2026年10月；店铺营业与人流会变化。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"}]},{"id":"hasedera","name":"长谷寺","route":"kamakura","time":"12/7 13:45–15:00；冬季16:30停止入场","subject":"山门、池园、寺院外观与高处海景","shots":[{"title":"山门与灯笼的到此一景","focal":"24–35mm","composition":"山门外侧或入山后允许停留的宽处，避开检票和入门动线。 中远景；门柱构成左右边界，灯笼位于画面中央或略偏上，保留完整屋檐。先拍一张端正横幅，再补35mm竖幅。 光线：屋檐下的灯笼可能比天空暗，优先保灯笼文字和门柱纹理；必要时减少天空，而不是只把曝光拉高。","settings":"F5.6–8，1/125秒起；有人经过可1/250秒。 不为了空景长时间堵在山门中央。"},{"title":"下境内池园的静与动","focal":"35–50mm","composition":"下境内放生池周边的开放步道，选择能见池岸、石与树的角度。 横幅中景；池岸曲线从角落进入，水面留白，树木或石作主角。若倒影杂乱，改用70mm只拍一块水纹与树影。 光线：薄云或细雨适合柔和水面与湿石纹理；水面镜面反光很强时移动站位，不需要等不存在的完美倒影。","settings":"F5.6；树叶被风吹动或要冻结水纹时提高至1/250秒。 不伸越栏杆、不踩入苔地，不搬动落叶布景。"},{"title":"海光露台：城市到海的三层","focal":"24–35mm交代环境；50–70mm压缩屋顶与海岸","composition":"海光テラス（海光露台／见晴台）开放栏杆后方，选择不挡座椅与通行的空位。 全景用近处树梢或屋顶作前景，城镇作中景，海面作背景；镜头水平，地平线放上1/3附近。中焦版只留屋顶、海岸与远山。 光线：若朝海方向逆光，先用遮光罩并调整站位，让太阳离开画面；保住海面亮斑，允许城镇稍暗。不要承诺特定时段一定顺光或能见远岛。","settings":"F5.6–8，1/125–1/250秒；风大提高速度，别把相机放在栏杆外。"},{"title":"观音堂外观与户外地藏细节","focal":"35–50mm外观；50–70mm户外地藏细节","composition":"观音堂外侧平地先拍屋檐和柱廊；细节可选开放步道旁的和み地藏或良缘地藏。 外观以一段屋檐、柱列和台阶组成，不一定塞入整栋建筑；地藏镜头接近雕像高度，背景简化，石像之外留呼吸空间。 光线：柔光适合石质细节；侧光可突出纹理。若有枯枝或残叶，只让它们从一角进入，不遮住主体。","settings":"外观F5.6；单组地藏F4–5.6，避免F2.8让同一排雕像只有一尊清楚。 仅在开放位置手持拍室外，进入观音堂便收机；尊重供养物，不触碰或摆动雕像。"}],"cautions":["12月按通常期间：08:00–16:30受理入山，17:00闭山；成人400日元。","观音堂内禁止拍照和录像，本尊不列入拍摄清单；不能把室外可拍扩大为所有殿内可拍。","观音博物馆是独立规则：官方公告自2019年8月23日起允许馆内拍摄，禁止闪光与妨碍他人观展，临展部分区域可能禁拍。若把它作为雨天参观备选，先看入口与展品旁标识。","寺院官网礼仪建议殿内安静、不大声说话或用手机；佛前合掌静祈，不需拍手。","2026年红叶夜间特别参拜目前公布为11月21日至12月6日，日落起至19:00停止入场、19:30闭山；12月7日不能默认延长到夜间。官网仅保留依红叶情况延长的可能。","阴雨可把广阔海景缩短，增加池园、湿石和建筑外观；观音堂照常以参拜为主。博物馆可作为参观备选，但不要把它宣传成无条件可摄影的室内场景。","官方介绍可见由比滨及远处景观，远岛是否可见取决于能见度；12月无紫阳花花海。"],"sources":[{"label":"镰仓长谷寺：参观指南","url":"https://www.hasedera.jp/guide/"},{"label":"镰仓长谷寺：境内介绍","url":"https://www.hasedera.jp/about/"},{"label":"长谷寺官方英文礼仪页","url":"https://www.hasedera.jp/en/more/"},{"label":"观音博物馆：馆内摄影通知","url":"https://www.kannon-museum.jp/2019/08/1623/"},{"label":"长谷寺：2026秋季夜间特别参拜","url":"https://www.hasedera.jp/2026/10/23900/"}],"compositionIdeas":["35–50mm：从见晴台把屋顶、海湾、远处岬角排成三层，天空平淡就少留。","24–35mm：侧前方拍观音堂，把完整屋檐、台阶与一小块庭院带进去。","50–70mm：取庭院枝叶与建筑一角；红叶状态按现场选，不追求满树。"],"references":[{"title":"View over Kamakura bay.JPG","asset":"ref-hasedera-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/f/f8/View_over_Kamakura_bay.JPG","pageUrl":"https://commons.wikimedia.org/wiki/File:View_over_Kamakura_bay.JPG","credit":"Biliana Nikolova-Lefterova","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","date":"4 October 2014, 06:03:01","description":"View over Kamakura bay from Hase-Dera","width":1100,"height":825,"size":194057,"caption":"由寺院望向海湾","composition":"树枝在边缘作框，屋顶与海岸线逐层推向远处。","seasonNote":"2014年10月；天气、植被和能见度以当天为准。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"},{"title":"Kamakura Hasedera Kannondou.jpg","asset":"ref-hasedera-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/c/c8/Kamakura_Hasedera_Kannondou.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Kamakura_Hasedera_Kannondou.jpg","credit":"Junichi","license":"CC BY-SA 3.0","licenseUrl":"http://creativecommons.org/licenses/by-sa/3.0/","date":"2006-08-11","description":"Photograph of Hase-dera Kannon-dō Hall in Kamakura-shi, Kanagawa, Japan.","width":1000,"height":750,"size":167494,"caption":"观音堂侧前方","composition":"建筑占主要面积，屋檐与台阶都留完整。","seasonNote":"2006年8月；只参考室外建筑构图。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"}]},{"id":"kotokuin","name":"高德院·镰仓大佛","route":"kamakura","time":"12/7 12:55起；冬季16:45停止入场","subject":"大佛全形、侧面轮廓、铜质纹理和庭院尺度","shots":[{"title":"正面全形：把台座和天空留完整","focal":"35–50mm；空间不够才用24–35mm","composition":"从入口到大佛正面参道的开阔位置，站在不挡参拜动线的一侧，选择香烟较少的方向。 横幅或竖幅全景；把台座、双肩和头顶留完整，让佛像占画面主要部分。人群在下方成为尺度，尽量不切断半个人。 光线：先比较像身与天空明暗。面部有柔和侧光时保铜色层次；天空很亮时少留天空，别把佛像抬亮到失去纹理。","settings":"F5.6–8，1/125–1/250秒。 不要求参拜者让开，也不走进香炉或供台区域。"},{"title":"斜前方：轮廓比正面更立体","focal":"50–70mm","composition":"沿开放通道走到大佛左右斜前方，比较两侧光线后选一侧。 中景；上半身和肩线为主，让脸朝向的一侧留更多空白。避免背后树枝刚好穿过头部轮廓。 光线：选择脸部有侧光、背景较暗的一侧；若是逆光，可接受轮廓与体块，不用闪光灯试图照亮整尊佛像。","settings":"F5.6，1/250秒优先；对焦在脸部或清晰衣纹。 站在允许通行的位置，不绕入围挡内追求角度。"},{"title":"70mm：衣褶、手部与台座","focal":"70mm","composition":"在开放步道内寻找能看到局部的角度，保持参拜空间。 局部中近景；只选择衣褶、手部或台座其中一种纹理。24–70mm不是超长焦，不必强求把面部填满整张照片。 光线：斜射光能突出铜面和衣褶的起伏；阴天则强调几何线条，适合保留较柔和对比。","settings":"F4–5.6；以实际快门1/250秒为优先，拍后放大看铜面细节。 不把镜头伸到他人面前或祈祷区域。"},{"title":"庭院关系：树枝只做边框","focal":"24–35mm","composition":"离大佛稍远的开放庭院位置，从树木边缘拍回佛像。 环境远景；少量树枝放在上角或侧边，大佛位于中部偏一侧，地面作尺度。树枝不要从头顶或脸部穿过。 光线：逆光可让近处树枝成为剪影，像身仍保有轮廓；太阳移到画面外以减少耀斑。","settings":"F5.6–8；分别对准远处佛像拍，不需要让很近的枝叶也完全清楚。"}],"cautions":["10月至3月08:00–17:00，最晚16:45入场；大佛胎内全年08:00–16:30，最晚16:20进入。成人300日元，胎内另50日元。","当前官方FAQ对“大佛像胎内是否可拍摄”明确回答不允许；可进入参观不等于可以拍照或录像。","商业用途拍摄及照片、影像再刊载需查阅寺方申请规定；本攻略不安排正式制作布景。","境内及敷地内禁止饮食及携入食物、开口饮料；补水用密封瓶或水壶可带。请先处理小町通购买的即食食物与开口杯。","阴天能减少铜像高光与天空反差，仍值得拍；大雨只保留正面与侧面两张，不为拍摄在户外久等。胎内仅参观，不能作为雨天录像场景。","红叶和银杏状态看当年，冬树本身也可构图。"],"sources":[{"label":"高德院官方首页：参观时间与票价","url":"https://www.kotoku-in.jp/"},{"label":"高德院：FAQ","url":"https://kotoku-in.jp/site/faq"},{"label":"高德院：境内图","url":"https://kotoku-in.jp/grounds_info.html"}],"compositionIdeas":["35–50mm：先拍正面全像，留完整底座和头顶，以少量游人交代尺度。","50–70mm：到侧面用斜线组织脸部、肩膀与衣褶，背景尽量简洁。","人多时提高取景只拍上半身；无需为了无人全景耗掉下一站时间。"],"references":[{"title":"Kamakura Daibutsu 20191214.jpg","asset":"ref-kotokuin-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/9/9b/Kamakura_Daibutsu_20191214.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Kamakura_Daibutsu_20191214.jpg","credit":"QUICPay","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","date":"2019-12-14","description":"神奈川県鎌倉市高徳院にある大仏","width":1100,"height":732,"size":187190,"caption":"大佛正面与尺度","composition":"完整佛像放中间，两侧游人和树木提供尺度。","seasonNote":"2019年12月；人流与树木状态可能不同。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"},{"title":"Kamakura Daibutsu side view.jpg","asset":"ref-kotokuin-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/1/1f/Kamakura_Daibutsu_side_view.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Kamakura_Daibutsu_side_view.jpg","credit":"Astrooscar","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","date":"22 March 2013, 08:48  〔according to Exif data〕","description":"Side view of Kamakura Daibutsu","width":1100,"height":825,"size":149879,"caption":"大佛侧面与衣褶","composition":"肩线与衣褶构成斜线，保留一侧干净天空。","seasonNote":"2013年3月；随现场动线选择侧面角度。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"}]},{"id":"yuigahama","name":"由比滨 · 阴天备选","route":"kamakura","time":"12/7 15:35–16:30，替换稻村崎时","subject":"弧形岸线、波纹、湿沙反光与冬日晚光","shots":[{"title":"弧形岸线：从一角引向远处","focal":"24–35mm","composition":"从长谷站方向抵海后，站在干燥、宽阔且开放的沙滩或滨海道路步行空间，沿岸线观察。 横幅全景；岸线从下方一个角进入，浪带为中景，海岬或远岸为背景。天空平淡就少留，云层有层次再加大天空比例。 光线：太阳不一定在正前方；先朝有层次的光线方向拍，再判断是否值得拍逆光。保持地平线水平。","settings":"F5.6–8，1/250秒起；海风中优先稳定和速度。 不站在骑行或步行主通道中，不为低机位靠近涌浪。"},{"title":"退浪后的湿沙","focal":"35–50mm","composition":"安全干沙位置观察刚退去的浪线，不追着海水向前走。 中景或细节；把湿沙反光放在下半部，保留一条退去的白色浪边。相机略放低即可，不需要贴地。 光线：逆光时湿沙会亮起来；先看反光是否过曝，必要时从−0.3EV小步调整。无倒影时改拍沙纹与泡沫。","settings":"F5.6；要清晰波纹可1/250–1/500秒，不依赖三脚架慢门。 浪一轮轮会变化，先观察再停留，不把器材放在湿沙上。"},{"title":"70mm：浪与远岸的分层","focal":"50–70mm","composition":"在不靠近海水的站位，寻找前后不同颜色或亮度的几条浪带。 横幅中远景；下方一条近浪，中部深浅海面，上方远岸或海岬。每层保留清晰边界，减少杂乱天空。 光线：侧光会让浪边变亮；天空灰时可把天空裁掉，专拍浪带的明暗节奏。","settings":"F5.6，1/500秒可冻结浪花；想保留一点动感时再试1/250秒。"},{"title":"晚光收尾：拍光，不必追太阳","focal":"35–70mm","composition":"原有安全站位朝西侧天空与海岸方向观察，不额外赶去新海岬。 中远景；选一段亮云、山体剪影和海面亮带，前景保持简洁。太阳可在画外，不必把圆形太阳放在正中央。 光线：明显逆光时用遮光罩、擦净前镜片；从正常曝光开始，只有亮云和水面细节丢失时才小幅减曝光。日光被地形挡住后仍可拍天空余色。","settings":"F4–5.6，ISO AUTO；实际快门尽量不低于1/125秒，风大用1/250秒。"}],"cautions":["公共海岸没有寺院式统一检票时段；本攻略只安排白天至傍晚散步。官方海水浴场信息对应7–8月，12月不安排入水。","海风强、扬沙或持续降雨时取消海边，把剩余时间留给长谷附近或镰仓站周边营业中的咖啡店。薄云且风小仍可拍浪带，海边10–15分钟也足够留一组照片。","镰仓稻村崎点位计算12/7日落16:29，作为邻近海岸规划参考；由比滨西侧地形、云层会更早挡光。厚云时不为日落拖延返程。","冲浪者和船只只作碰巧遇到的尺度，不把它们当作保证出现的拍摄内容。","不保证太阳落入海平面，不承诺富士山能见度；厚云时不为等日落拖延返程。"],"sources":["k_beach_access","v4_light_kamakura"],"compositionIdeas":["24–35mm：放低一点机位，让退潮湿沙与浪线由下角进入，地平线保持水平。","35–50mm：日落时把小人物放在画面一侧，保留海面亮带和人物剪影。","70mm：选一小段浪花或远处帆影；风大优先1/250秒以上，别只顾压低ISO。"],"references":[{"title":"Yuigahama 02.jpg","asset":"ref-yuigahama-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/5/5d/Yuigahama_02.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Yuigahama_02.jpg","credit":"akira yamada from Yokohama, Japan","license":"CC BY-SA 2.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/2.0","date":"7 December 2008, 16:19","description":"由比ヶ浜から見た日の入り","width":825,"height":1100,"size":95089,"caption":"日落与小人物剪影","composition":"人物偏一侧，浪线与落日亮带把画面连起来。","seasonNote":"2008年12月7日；日落色彩、潮位与天气不保证相同。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"},{"title":"Kamakura Yuigahama beach during winter with strong wind.jpg","asset":"ref-yuigahama-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/2/27/Kamakura_Yuigahama_beach_during_winter_with_strong_wind.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Kamakura_Yuigahama_beach_during_winter_with_strong_wind.jpg","credit":"Syced","license":"CC0","licenseUrl":"http://creativecommons.org/publicdomain/zero/1.0/deed.en","date":"15 January 2025","description":"Kamakura Yuigahama beach during winter with strong wind","width":1000,"height":753,"size":170784,"caption":"冬日浪线与帆影","composition":"海浪分成近、中、远三层，帆影作为小焦点；70mm先留较宽画面，再适度裁切。","seasonNote":"2025年1月；帆船与海况取决于当天。","changes":"等比例缩放与JPEG压缩；未改变画面内容。"}]},{"id":"shibuya_sky","name":"SHIBUYA SKY · 城市日落","route":"common","time":"12/6 15:40–17:15","subject":"西侧日落、屋顶人与城市尺度、蓝调楼群","verify":true,"compositionIdeas":["24–35mm：西侧取城市与天光各一半；云层漂亮就天空占2/3，地面只留一条楼群，避免一张塞进四个方向。","35–50mm：用屋顶栏杆或地面斜线引向远方，人物留在画面下方作尺度；站到人群外缘等空隙，不站在扶梯出口拍。","50–70mm：蓝调时取一片亮起的楼群，控制亮招牌不过曝；室内镜头靠近玻璃、深色衣服遮反光，屋顶优先找无遮挡角度。"],"shots":[{"title":"西侧日落与云层","focal":"24–35mm","composition":"先定地平线，太阳附近保高光；不必追求把太阳正居中。","settings":"A档F5.6–8，ISO AUTO100–3200，1/125秒起；必要时曝光补偿-0.3至-1。"},{"title":"屋顶合影与尺度","focal":"35–70mm","composition":"三人同一平面，人物占约1/3，天空或楼群交代地点；70mm需足够后退空间。","settings":"F4–5.6保证三人清晰，1/250秒；请同行或路人手持拍。"},{"title":"蓝调与夜景","focal":"35–70mm","composition":"挑一片有秩序的亮窗，不拍成满画面杂光；室内遮住反射。","settings":"M+Auto ISO，F2.8–4、1/60–1/125秒，放大检查后调整。"}],"cautions":["所有时间为目标；未出票，强风、雨雪等可能关闭屋顶。","禁止带三脚架、独脚架和自拍杆上屋顶；包按规定寄存，相机必须按要求使用颈带。","不把开放式屋顶当成完全没有玻璃；实际有玻璃护栏，按站位避开反光；请勿把相机伸到护栏外。"],"sources":[{"label":"SHIBUYA SKY｜购票与携带物品","url":"https://www.shibuya-scramble-square.com/sky/ticket/"},{"label":"SHIBUYA SKY｜官方票价、开售与取消规则","url":"https://www.shibuya-scramble-square.com/assets/pdf/about/20250227scsq.pdf"},{"label":"SHIBUYA SKY｜FAQ与屋顶开放","url":"https://www.shibuya-scramble-square.com/sky/faq/"}],"references":[{"asset":"ref-sky-01","path":"/workspace/scratch/0b643c3beabd/tmp/tokyo/v4_tokyo_assets/ref-sky-01.jpg","caption":"城市日落 · 天空与楼群","composition":"地平线放下方，云层与射线引向城市；24–35mm先拍天地关系。","credit":"Kakidai / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:Shibuya_Scramble_Square_-_SHIBUYA_SKY_12.jpg","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","date":"2019-11","seasonNote":"11月历史实景；12月落日方位、云层与楼群灯光按当天。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/6/6b/Shibuya_Scramble_Square_-_SHIBUYA_SKY_12.jpg","width":2500,"height":1593,"changes":"原图直接嵌入，未裁切、未重编码、未修改画面内容。"},{"asset":"ref-sky-04","path":"/workspace/scratch/0b643c3beabd/tmp/tokyo/v4_tokyo_assets/ref-sky-04.jpg","caption":"屋顶夕阳 · 人物作尺度","composition":"让人物留在画面下半部，地面影子形成引导线；拍摄时避开扶梯与通道。","credit":"Kakidai / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:Shibuya_Scramble_Square_-_SHIBUYA_SKY_13.jpg","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0/","date":"2019-11","seasonNote":"11月历史实景；仅参考人物与天光关系，现场设施和人流可能变化。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/6/61/Shibuya_Scramble_Square_-_SHIBUYA_SKY_13.jpg","width":2500,"height":1701,"changes":"原图直接嵌入，未裁切、未重编码、未修改画面内容。"},{"asset":"ref-sky-02","path":"/workspace/scratch/0b643c3beabd/tmp/tokyo/v4_tokyo_assets/ref-sky-02.jpg","caption":"夜色楼群 · 塔与光带","composition":"用一条亮路引向城市，50–70mm可再收紧；先确保快门足够清楚。","credit":"先従隗始 / Wikimedia Commons","pageUrl":"https://commons.wikimedia.org/wiki/File:The_views_of_Shibuya_Sky_20211126_02.jpg","license":"CC0 1.0","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/","date":"2021-11-26 19:36","seasonNote":"11月19:36夜景；主线17:15离开，借鉴楼群选择，不承诺同样灯光。","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/2/29/The_views_of_Shibuya_Sky_20211126_02.jpg","width":4608,"height":3456,"changes":"原图直接嵌入，未裁切、未重编码、未修改画面内容。"}]},{"id":"arakura","name":"新仓山浅间公园 · 忠灵塔","route":"fuji","time":"12/7 约09:40–10:10","subject":"红色塔檐、富士山与富士吉田街区","shots":[{"title":"塔与山左右平衡","focal":"24–35mm","composition":"在忠灵塔上方展望台，塔放右侧、山放左侧；先给塔尖留完整空间，再检查富士山峰顶是否被枝条压住。","settings":"A档F5.6–8，ISO AUTO 100–3200，最低快门1/125秒。"},{"title":"从塔檐看远山","focal":"50–70mm","composition":"把一部分塔檐作为近景，和山体形成大小对比；较长焦段会收窄画面，避免为了塔全景退到非开放区域。","settings":"F5.6–8，最低快门1/250秒。"},{"title":"三人合影","focal":"35–50mm优先","composition":"站在同一对焦平面，人物占画面约1/3，塔与山仍留得出来。70mm需要后退，平台拥挤时用35–50mm更容易。","settings":"F4–5.6，1/250秒，眼部对焦；定时前先对焦，按现场规定使用支架。"}],"cautions":["10:10开始下山，约10:35回到站台，保住10:46普通车。","冬季没有樱花，红叶与积雪也不保证；不要把晴天样片当现场能见度。","人多时短时间轮换机位，不占用栏杆或通道。"],"sources":[{"label":"富士吉田官方｜新仓山浅间公园与25分钟步行路线","url":"https://www.fujiyoshida.net/course/index.php?p=course-365"},{"label":"山梨官方｜上午光线与季节说明","url":"https://www.yamanashi-kankou.jp/kankou/spot/p1_4919.html"}],"compositionIdeas":["24–35mm：塔放右、富士山放左，塔尖和山尖都留一点空隙。","50–70mm：取少量塔檐与远山，减少街区杂物；焦段变长后不强求整塔。","合影先用35–50mm，三人站成同一平面；平台拥挤时迅速拍完让位。"],"references":[{"title":"Chureito Pagoda and Mount Fuji 20241022.jpg","asset":"ref-arakura-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/3/3b/Chureito_Pagoda_and_Mount_Fuji_20241022.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original","pageUrl":"https://commons.wikimedia.org/wiki/File:Chureito_Pagoda_and_Mount_Fuji_20241022.jpg","credit":"Supanut Arunoprayote","license":"CC BY 4.0","licenseUrl":"https://creativecommons.org/licenses/by/4.0","date":"22 October 2024, 11:00:56","description":"The early autumn view of Chūrei-tō pagoda and Mount Fuji in the Arakurayama Sengen Park, Fujiyoshida, Yamanashi, central Japan.","width":1280,"height":853,"caption":"完整塔尖与富士山","composition":"塔与山左右分置，中间用街区交代距离。","seasonNote":"2024年10月作品；12月树叶、积雪与云层不同。","changes":"采用Wikimedia已提供的1280px等比例预览，未另行裁剪或重压缩。"},{"title":"Chureito-Fujisan-2016-Luka-Peternel.jpg","asset":"ref-arakura-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/9/9f/Chureito-Fujisan-2016-Luka-Peternel.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original","pageUrl":"https://commons.wikimedia.org/wiki/File:Chureito-Fujisan-2016-Luka-Peternel.jpg","credit":"Luka Peternel","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","date":"2016-10-24 07:41:30","description":"View of Fujiyoshida's Chūrei-tō in October 2016. Mount Fuji is visible in the background.","width":1280,"height":993,"caption":"薄云中的塔檐与山形","composition":"较紧取景仍可用塔檐和山体呼应；保护亮天，不强行提亮全部阴影。","seasonNote":"2016年10月、等效32mm；参考云层遮山时的明暗关系。","changes":"采用Wikimedia已提供的1280px等比例预览，未另行裁剪或重压缩。"}]},{"id":"oike_sunset","name":"大池公园 · 湖岸暮色","route":"fuji","time":"12/7 15:50–16:50","subject":"湖岸、云层余晖与转身可见的富士山","shots":[{"title":"岸线带向远处","focal":"24–35mm","composition":"向湖面拍时，用岸线从下角带入；云层有颜色就多留天空，没有层次时收紧到水面纹理。","settings":"A档F5.6–8，ISO AUTO，最低快门1/125秒；有风1/250秒。"},{"title":"云与雪线","focal":"70mm","composition":"转向南面找富士山，选一小块有层次的云，不把朝北的湖面机位硬套到山的方向。","settings":"F4–5.6，1/250秒；先保护亮云，必要时稍降曝光。"},{"title":"暮色人物剪影","focal":"35–50mm","composition":"让三个人彼此留空隙，不重叠成一团；身体轮廓放到较亮天空前，不踩进湿滑水边。","settings":"M档1/250秒、F4，ISO AUTO；按天空曝光检查直方图。"}],"cautions":["河口湖12/7地平线日落约16:32；山体会提前遮住太阳，现场以天色为准。","大池公园北侧是湖、南侧是富士山；此站主要拍晚光，并非北岸山湖同框机位。","16:50收机，步行预留30分钟回站；若留到更晚会压缩17:41上车缓冲。"],"sources":[{"label":"河口湖官方观光｜大池公园位置与开放信息","url":"https://fujisan.ne.jp/sightseeing/1628/"},{"label":"山梨官方｜大池公园：北侧湖面、南侧富士山","url":"https://www.yamanashi-kankou.jp/viewpoint/pub/pvp054.html"},{"label":"国立天文台｜日出日落定义与地形遮挡","url":"https://www.nao.ac.jp/faq/a0103.html"}],"compositionIdeas":["24–35mm：用弯曲岸线引入，湖面与天空各留多少按当天云层决定。","转身向南以70mm找富士山与晚云；北面湖景、南面山景分开拍。","三人剪影各留间隙，轮廓放到亮天空前；16:50收机回站。"],"references":[{"title":"Lake Kawaguchiko (10863336614).jpg","asset":"ref-oike-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/f/fa/Lake_Kawaguchiko_%2810863336614%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original","pageUrl":"https://commons.wikimedia.org/wiki/File:Lake_Kawaguchiko_(10863336614).jpg","credit":"Guilhem Vellut","license":"CC BY 2.0","licenseUrl":"https://creativecommons.org/licenses/by/2.0","date":"2013-11-13 16:23","description":"Lake Kawaguchiko","width":1280,"height":960,"caption":"阴天湖岸的层次","composition":"从开放岸边取弯曲水线，近岸、远岸、云层分成三层。","seasonNote":"2013年11月16:23作品；12月草木与水位不同。","changes":"采用Wikimedia已提供的1280px等比例预览，未另行裁剪或重压缩。"},{"title":"Mount Fuji @ Lake Kawaguchiko (10863334474).jpg","asset":"ref-oike-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/1/14/Mount_Fuji_%40_Lake_Kawaguchiko_%2810863334474%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original","pageUrl":"https://commons.wikimedia.org/wiki/File:Mount_Fuji_@_Lake_Kawaguchiko_(10863334474).jpg","credit":"Guilhem Vellut","license":"CC BY 2.0","licenseUrl":"https://creativecommons.org/licenses/by/2.0","date":"2013-11-13 16:22","description":"Mount Fuji @ Lake Kawaguchiko","width":1280,"height":960,"caption":"富士山与傍晚云色","composition":"山尖留在下方，保留一片有色云；不依赖完整湖景。","seasonNote":"2013年11月16:22、等效112mm；你的70mm会更宽，可适度裁切。","changes":"采用Wikimedia已提供的1280px等比例预览，未另行裁剪或重压缩。"}]},{"id":"inamuragasaki","name":"稻村崎公园","route":"kamakura","time":"12/7 15:45–16:55","subject":"西侧海湾、江之岛、远山轮廓与日落余色","shots":[{"title":"草坡—海岸—远山三层","focal":"24–35mm","composition":"站在开放的公园观景处，用少量草坡或步道作下沿，海岸弧线引向西侧，远山留在上方。地平线摆平；天空有晚霞才多留，没有山就突出浪带。","settings":"A档F5.6–8；海风中1/250秒起、ISO AUTO 100–6400。"},{"title":"富士山与江之岛的关系","focal":"50–70mm","composition":"能见度好时，以海面为下层，把江之岛和富士山分开放在左右；70mm仍是环境风景，不能保证得到超长焦样片的山体大小。避免山尖与岛上建筑重叠。","settings":"F5.6，1/250秒起；晚光转暗可F4，不执着ISO 100。"},{"title":"浪带与余晖的明暗","focal":"35–70mm","composition":"先找三条深浅不同的浪带，让明亮浪边穿过画面。日落后留一点天色，不追着涌浪靠近水边；阴天也能拍浪纹和岸线。","settings":"1/250–1/500秒、F4–5.6；检查海面高光，傍晚摘CPL。"},{"title":"三人合影：先露脸，再剪影","focal":"35–70mm","composition":"15:45到达后先拍清楚脸部的一张；三人同排、人物合计占画面约1/3，海湾交代地点。晚些再背向亮天空拍剪影；空间不足用35–50mm，不后退到台阶或通道外。","settings":"F4–5.6、1/250秒起；眼部对焦。借路人或定时拍摄只占用短时间，现场允许才用小支架。"}],"cautions":["12/7点位理论日落16:29，日落后约25–30分钟作为余晖规划；不是保证可见太阳的时间。西侧山体、云层会提前遮光。","富士山、晚霞、冲浪者均不保证出现；12月落日方向与9月参考图不同，不照搬参考图的太阳位置。","主线只去公园开放步道与宽阔观景处。沙滩与礁石不是为了拍照必须到达的位置；不跨围栏、不占车道。","16:55离开公园，保留回站和JR换乘余量。"],"sources":["v4_inamura_park","v4_light_kamakura","v4_cpl_guide","v4_inamura_photo1","v4_inamura_photo2"],"compositionIdeas":["24–35mm：草坡只留薄薄一层，海岸曲线指向远山；先拍地点完整的一张。","50–70mm：把江之岛与富士山放开，收紧多余天空；没见到山就改拍浪带。","35–50mm：人物同一排，海湾作背景；先拍露脸合影，再试余晖剪影。"],"references":[{"title":"Mt. Fuji from Inamuragasaki 02.jpg","asset":"ref-inamuragasaki-1","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/f/f9/Mt._Fuji_from_Inamuragasaki_02.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Mt._Fuji_from_Inamuragasaki_02.jpg","credit":"Quercusacuta","license":"CC BY-SA 4.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/4.0","date":"2016-01-19","description":"冬日从稻村崎公园望海湾与富士山。","width":1280,"height":960,"size":372448,"caption":"海浪、海岸与富士山的三层","composition":"少量草坡作前景，浪带引向远岸，山峰与海面形成上下层次。","seasonNote":"2016年1月白天实景；本次傍晚会更偏剪影，富士能见度与海况不保证。","changes":"使用Wikimedia提供的1280px预览；未再次压缩或改变画面内容。"},{"title":"Inamuragasaki 02.jpg","asset":"ref-inamuragasaki-2","sourceImageUrl":"https://upload.wikimedia.org/wikipedia/commons/1/1e/Inamuragasaki_02.jpg","pageUrl":"https://commons.wikimedia.org/wiki/File:Inamuragasaki_02.jpg","credit":"椎林 隆夫","license":"CC BY-SA 3.0","licenseUrl":"https://creativecommons.org/licenses/by-sa/3.0","date":"2009-09-16 17:31","description":"稻村崎海岸夕光中的冲浪者。","width":1280,"height":960,"size":157611,"caption":"余晖亮带与小人物","composition":"沿海岸找反光带，人物作为小尺度；借鉴明暗和弧线，不必追求同样视角。","seasonNote":"2009年9月夕景；冬季太阳方向与色彩不同，冲浪者不保证出现。主线从公园取景，无需为复刻走到湿沙。","changes":"使用Wikimedia提供的1280px预览；未再次压缩或改变画面内容。"}]}],"video":[{"title":"01 全景交代地点","focal":"24–35mm","seconds":8,"action":"固定拍街道、寺院外观、山湖或海岸，剪成约3–4秒。先检查地平线与画面边缘。"},{"title":"02 中景说明关系","focal":"35–50mm","seconds":8,"action":"建筑与街道、桥与船、城镇与海面组成中景；相机不动，剪成约3–4秒。"},{"title":"03 细节增加质感","focal":"50–70mm","seconds":6,"action":"门灯、砖纹、木纹、雪线或热食蒸汽只选一个主角，剪约3秒。店内拍摄先问。"},{"title":"04 让场景发生变化","focal":"35–50mm","seconds":8,"action":"保持机位固定，等行人、船、海浪或灯光自然变化；不用每条都摇镜头。"},{"title":"05 一段转场","focal":"24–35mm","seconds":6,"action":"路牌、路径、车站名称或入口交代下一段行程，剪约3秒；不站在通道中央拍。"},{"title":"06 安静收尾","focal":"35–50mm","seconds":10,"action":"拍傍晚城市、冬海或天空，尾部多留几秒，剪成约4–5秒。强风可改用街巷静景。"}],"troubleshooting":[{"problem":"A档设了最低快门，照片仍然糊","action":"ISO AUTO Min.SS不是硬性下限。ISO到上限后相机可能继续放慢快门；看实际速度，开大光圈或切M + Auto ISO固定快门。"},{"problem":"整张照片的边缘和文字都糊","action":"先提高快门，双肘靠近身体、轻压快门；70mm、海风或手冷时从1/250秒试起。再检查前镜片有没有水滴或雾。"},{"problem":"人糊了，楼却清楚","action":"这是主体移动，防抖无法解决。改1/125–1/250秒起，快速动作试1/500秒；不要只降低ISO。"},{"problem":"逆光下主体黑，天空又很亮","action":"先决定保主体细节还是剪影。减少过亮天空、让太阳离开画面，再以1/3EV小步调整。不要把阴影和天空强行拍得一样亮。"},{"problem":"灯牌、雪峰或浪花一片白","action":"检查亮部细节，确实溢出再小幅减曝光；大片白雪拍灰时反而可能需加一点。不要固定雪景+1EV或夜景一律−1EV。"},{"problem":"玻璃把自己和室内灯都映出来","action":"想消除反射就靠近但不碰玻璃，用深色衣物遮住身后亮面、关闭闪光；想利用反射就选择一层作主角，对焦在那一层。"},{"problem":"雨夜灯光像脏雾，海边画面对比变差","action":"先擦前镜片水滴、盐雾，遮光罩减少直射光，再拍同一画面比较；别先连续改ISO和白平衡。"},{"problem":"照片里什么都有，却没有主角","action":"左右移动两步，或从24mm改到50mm；只保留一条岸线、一排窗或一个灯笼，去掉抢眼的边缘杂物。"},{"problem":"富士山一直被厚云挡住","action":"提高ISO或更长焦不会让山穿过云。拍湖面、岸边纹理和同行体验，按返程时间走。"},{"problem":"想在寺院里补雨天照片或短片","action":"进入禁拍空间就收机：长谷寺观音堂与高德院大佛胎内均不列入拍摄。观音博物馆按单独规定及当日展区标识，不把可参观当作可摄影。"},{"problem":"短片摇晃、风声盖过环境声","action":"每条固定拍6–10秒，前后多留2秒；优先相机不动让场景动。强风不用硬留机内爆风声，换安静街巷素材。可选视频起点为XAVC S 4K 25p（PAL）、M档1/50秒、F4、ISO AUTO，无需Log。"}],"gearSources":["v4_lens_82mm","v4_camera_battery","v4_cpl_guide","shibuya-sky-items"],"groupAdvice":"三人站同一排；有足够后退空间可用70mm，F4–5.6、1/250秒起，人物约占画面1/3并留出地点背景。较窄的位置改35–50mm；F2.8只在三张脸基本同一焦平面时尝试。小支架、定时或手机遥控先遵守场地规定。","quick":[{"scene":"白天风景","mode":"A","aperture":"F5.6–8","shutter":"≥1/125秒","iso":"AUTO 100–3200","note":"海风大改1/250秒；先看实际快门。"},{"scene":"街头行人","mode":"M＋Auto ISO","aperture":"F4","shutter":"1/250秒","iso":"AUTO 100–6400","note":"人物移动时优先快门，允许ISO上升。"},{"scene":"海岸逆光／浪花","mode":"M＋Auto ISO","aperture":"F5.6","shutter":"1/500秒","iso":"AUTO 100–6400","note":"检查亮云和浪花，必要时小幅减曝光。"},{"scene":"蓝调静物 · 手持","mode":"M＋Auto ISO","aperture":"F4","shutter":"1/125秒","iso":"AUTO 100–6400","note":"风小且主体不动才试1/60秒；傍晚摘CPL。"},{"scene":"夜街／市集人物","mode":"M＋Auto ISO","aperture":"F2.8–4","shutter":"1/125–1/250秒","iso":"AUTO 100–12800","note":"先保人物清楚，灯串高光保留层次。"},{"scene":"三人合影","mode":"M＋Auto ISO","aperture":"F4–5.6","shutter":"1/250秒","iso":"AUTO 100–6400","note":"35–70mm，三人同一排；70mm需留足后退空间。"}],"quickSources":["v4_sony_min_shutter"],"light":[{"date":"2026-12-05","place":"东京","route":"common","sunrise":"06:35","sunset":"16:28","blue":"约16:28–16:58","note":"12/6把日落与余晖留在SHIBUYA SKY；12/5到达时可能已进入夜色。","verify":true,"sources":["v4_light_tokyo","v4_light_method"]},{"date":"2026-12-06","place":"东京","route":"common","sunrise":"06:36","sunset":"16:28","blue":"约16:28–16:58","note":"12/6把日落与余晖留在SHIBUYA SKY；12/5到达时可能已进入夜色。","verify":true,"sources":["v4_light_tokyo","v4_light_method"]},{"date":"2026-12-07","place":"东京","route":"common","sunrise":"06:37","sunset":"16:28","blue":"约16:28–16:58","note":"12/6把日落与余晖留在SHIBUYA SKY；12/5到达时可能已进入夜色。","verify":true,"sources":["v4_light_tokyo","v4_light_method"]},{"date":"2026-12-08","place":"东京","route":"common","sunrise":"06:38","sunset":"16:28","blue":"约16:28–16:58","note":"12/6把日落与余晖留在SHIBUYA SKY；12/5到达时可能已进入夜色。","verify":t       var urls = manifest.files.map(function (file) {
        if (typeof file !== 'string' || !file || /^[a-z][a-z\d+.-]*:/i.test(file) || file.startsWith('//')) {
          throw new Error('Invalid asset path');
        }
        var url = new URL(file, location.href);
        if (url.origin !== location.origin || url.username || url.password) throw new Error('Invalid asset origin');
        return url;
      });
      if (new Set(urls.map(function (url) { return url.href; })).size !== urls.length) {
        throw new Error('Duplicate asset file');
      }
      if (progress) progress.max = urls.length;
      var loaded = 0;
      var chunks = await Promise.all(urls.map(async function (url) {
        var response = await fetch(url.href, { signal: controller.signal, credentials: 'same-origin' });
        if (!response.ok) throw new Error('Asset request failed');
        var chunk = await response.json();
        if (controller.signal.aborted || currentAttempt !== attempt) throw new Error('Load interrupted');
        if (!chunk || typeof chunk !== 'object' || Array.isArray(chunk)) throw new Error('Invalid asset data');
        loaded += 1;
        if (progress) {
          progress.value = loaded;
          progress.setAttribute('aria-valuetext', '已载入 ' + Math.round(loaded / urls.length * 100) + '%');
        }
        return chunk;
      }));

      var assets = Object.create(null);
      chunks.forEach(function (chunk) {
        Object.keys(chunk).forEach(function (key) {
          var value = chunk[key];
          if (Object.prototype.hasOwnProperty.call(assets, key) ||
              typeof value !== 'string' || !/^data:image\/[a-z\d.+-]+;base64,/i.test(value)) {
            throw new Error('Invalid image data');
          }
          assets[key] = value;
        });
      });
      if (Object.keys(assets).length !== manifest.count || controller.signal.aborted) {
        throw new Error('Incomplete image data');
      }

      data.assets = assets;
      dataElement.textContent = JSON.stringify(data).replace(/</g, '\\u003c');
      var script = document.createElement('script');
      script.id = 'guide-app';
      script.textContent = pending.textContent;
      manifestElement.remove();
      if (loading) loading.remove();
      pending.replaceWith(script);
      completed = true;
      var loader = document.getElementById('guide-loader');
      if (loader) loader.remove();
    } catch (error) {
      controller.abort();
      if (currentAttempt === attempt) {
        if (label) label.textContent = '加载未完成，请检查网络后重试。';
        if (retry) { retry.hidden = false; retry.disabled = false; }
      }
    } finally {
      clearTimeout(timeout);
      if (currentAttempt === attempt) running = false;
    }
  }

  if (retry) retry.addEventListener('click', function (event) {
    event.preventDefault();
    loadGuide();
  });
  loadGuide();
}());
</script>
